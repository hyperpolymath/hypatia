# This workflow is managed by gh actions-lock.
name: Credential read check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: credential-read-check
  cancel-in-progress: false

jobs:
  scanner:
    name: Scanner authentication and alert read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: api.github.com:443
      - name: Check scanner identity and one alert endpoint
        env:
          GH_TOKEN: ${{ secrets.HYPATIA_SCAN_PAT }}
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo '::error::HYPATIA_SCAN_PAT is missing'; exit 1; }
          gh api user --silent
          gh api 'repos/hyperpolymath/hypatia/dependabot/alerts?per_page=1' --silent
          echo 'Scanner: authentication and Hypatia Dependabot alert read passed. This is one-repository access evidence, not estate coverage.' >> "$GITHUB_STEP_SUMMARY"
  dispatch:
    name: Dispatch authentication and store read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: api.github.com:443
      - name: Check dispatch identity and observation-store visibility
        env:
          GH_TOKEN: ${{ secrets.HYPATIA_DISPATCH_PAT }}
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo '::error::HYPATIA_DISPATCH_PAT is missing'; exit 1; }
          gh api user --silent
          gh api 'repos/hyperpolymath/verisimdb-data/git/ref/heads/main' --silent
          echo 'Dispatch: authentication and store-ref read passed. Write, workflow, administrative and dispatch permissions were not tested.' >> "$GITHUB_STEP_SUMMARY"
