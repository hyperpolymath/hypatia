# This workflow is managed by gh actions-lock.
name: Credential read check

on:
  workflow_dispatch:
    inputs:
      scanner_only:
        description: Check only the scanner credential
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      scanner_only:
        description: Omit the separate dispatch credential check
        type: boolean
        required: false
        default: true
    secrets:
      HYPATIA_SCAN_PAT:
        description: Scanner credential to validate against Hypatia's three alert endpoints
        required: true
      HYPATIA_APP_ID:
        description: GitHub App ID; required only when scanner_only is false
        required: false
      HYPATIA_APP_PRIVATE_KEY:
        description: GitHub App private key; required only when scanner_only is false
        required: false

permissions:
  contents: read

concurrency:
  group: credential-read-check
  cancel-in-progress: false

jobs:
  scanner:
    name: Scanner authentication and three alert reads
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: api.github.com:443
      - name: Check scanner identity and all three alert endpoints
        env:
          GH_TOKEN: ${{ secrets.HYPATIA_SCAN_PAT }}
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo '::error::HYPATIA_SCAN_PAT is missing'; exit 1; }
          gh api user --silent
          failed=0
          for endpoint in dependabot/alerts code-scanning/alerts secret-scanning/alerts; do
            query='?per_page=1'
            if [ "$endpoint" = 'secret-scanning/alerts' ]; then
              query="${query}&hide_secret=true"
            fi
            if gh api "repos/hyperpolymath/hypatia/${endpoint}${query}" --silent; then
              printf 'Scanner: Hypatia %s read passed.\n' "$endpoint" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              printf 'Scanner: Hypatia %s read failed or is unavailable; see the API error.\n' "$endpoint" | tee -a "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
          done
          echo 'This checks authentication and three alert endpoints in one repository. It does not prove estate coverage, absence of alerts, or write access. An unavailable endpoint is not a pass.' >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"
  dispatch:
    if: ${{ !inputs.scanner_only }}
    name: Dispatch authentication and store read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: api.github.com:443
      - name: Mint dispatch token (GitHub App)
        id: app
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ secrets.HYPATIA_APP_ID }}
          private-key: ${{ secrets.HYPATIA_APP_PRIVATE_KEY }}
          owner: hyperpolymath
          repositories: verisimdb-data
          permission-contents: read
      - name: Check App authentication and observation-store visibility
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo '::error::the GitHub App token was not minted (HYPATIA_APP_ID / HYPATIA_APP_PRIVATE_KEY)'; exit 1; }
          gh api 'repos/hyperpolymath/verisimdb-data/git/ref/heads/main' --silent
          echo 'Dispatch: authentication and store-ref read passed. Write, workflow, administrative and dispatch permissions were not tested.' >> "$GITHUB_STEP_SUMMARY"
