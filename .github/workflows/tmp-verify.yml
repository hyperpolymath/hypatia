# SPDX-License-Identifier: MPL-2.0
# TEMPORARY verification (removed before merge).
name: tmp-verify

on:
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  pinned-score:
    name: pinned SHA, real target
    uses: ./.github/workflows/rsr-oracle.yml
    with:
      target-path: '.'

  bad-target:
    name: bogus target-path must fail
    uses: ./.github/workflows/rsr-oracle.yml
    with:
      target-path: 'does/not/exist'

  gate-fail:
    name: fail-under rhodium must fail but publish outputs
    uses: ./.github/workflows/rsr-oracle.yml
    with:
      fail-under: 'rhodium'

  # The called workflow's outputs are only visible to a downstream job.
  relay:
    name: relay outputs
    needs: [pinned-score, bad-target, gate-fail]
    if: always()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Report caller-visible results
        run: |
          set -euo pipefail
          body=$(cat <<'EOF'
          ### Reusable workflow, caller-visible results

          | job | result | tier | score | provisional |
          |---|---|---|---|---|
          | pinned SHA, real target | `${{ needs.pinned-score.result }}` | `${{ needs.pinned-score.outputs.tier }}` | `${{ needs.pinned-score.outputs.score }}` | `${{ needs.pinned-score.outputs.provisional }}` |
          | bogus target-path | `${{ needs.bad-target.result }}` | `${{ needs.bad-target.outputs.tier }}` | `${{ needs.bad-target.outputs.score }}` | `${{ needs.bad-target.outputs.provisional }}` |
          | fail-under rhodium | `${{ needs.gate-fail.result }}` | `${{ needs.gate-fail.outputs.tier }}` | `${{ needs.gate-fail.outputs.score }}` | `${{ needs.gate-fail.outputs.provisional }}` |

          Expected: pinned = success with a tier; bogus = failure with NO score
          (it refuses to score a missing tree); fail-under = failure BUT with a
          tier/score published before the failure.
          EOF
          )
          python3 -c 'import json,sys; print(json.dumps({"body": sys.argv[1]}))' "$body" > /tmp/b.json
          curl -sS -X POST -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/956/comments" \
            -d @/tmp/b.json -o /dev/null -w 'comment=%{http_code}\n'

  # The cross-repository branch-pin guard cannot be exercised from a PR: this
  # org blocks a newly added cross-repo `uses:` at startup. Test the decision
  # logic itself instead, on sample refs.
  pin-logic:
    name: pin-ref decision logic
    runs-on: ubuntu-latest
    steps:
      - name: Check the accept/reject table
        run: |
          set -euo pipefail
          decide() { # ref, same-repo -> 0 accept / 1 reject
            local ref="$1" self="$2" ok=0
            case "$ref" in
              refs/tags/*|v[0-9]*) ok=1 ;;
              refs/heads/*|main|master|HEAD|develop) ok=0 ;;
              *) printf '%s' "$ref" | grep -Eq '^[0-9a-f]{7,40}$' && ok=1 ;;
            esac
            [ "$self" = "1" ] && ok=1
            [ "$ok" = "1" ] && return 0
            return 1
          }
          fail=0
          check() { # expect(ref,self) desc
            if "$@" >/dev/null 2>&1; then echo "  accept"; else echo "  reject"; fi
          }
          expect_accept() { decide "$1" "$2" || { echo "FAIL: expected accept: ref=$1 self=$2"; fail=1; }; }
          expect_reject() { if decide "$1" "$2"; then echo "FAIL: expected reject: ref=$1 self=$2"; fail=1; fi; }

          expect_accept "9f1e2d3c4b5a69788796a5b4c3d2e1f0a1b2c3d4" 0
          expect_accept "9f1e2d3" 0
          expect_accept "refs/tags/v0.1.2" 0
          expect_accept "v0.1.2" 0
          expect_accept "refs/heads/main" 0      # same repo only
          expect_accept "refs/heads/main" 1
          expect_accept "refs/pull/956/merge" 1
          expect_reject "main" 0
          expect_reject "master" 0
          expect_reject "develop" 0
          expect_reject "HEAD" 0
          expect_reject "refs/heads/arena/0cc4e3dd-hypatia" 0
          expect_reject "not-a-sha" 0

          if [ "$fail" != "0" ]; then echo "::error::pin logic table failed"; exit 1; fi
          echo "pin logic table: all cases pass"
