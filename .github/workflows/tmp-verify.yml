# SPDX-License-Identifier: MPL-2.0
# TEMPORARY verification (removed before merge).
name: tmp-verify

on:
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  pinned-score:
    name: pinned SHA, real target
    uses: ./.github/workflows/rsr-oracle.yml
    with:
      target-path: '.'

  bad-target:
    name: bogus target-path must fail
    uses: ./.github/workflows/rsr-oracle.yml
    with:
      target-path: 'does/not/exist'

  gate-fail:
    name: fail-under rhodium must fail but publish outputs
    uses: ./.github/workflows/rsr-oracle.yml
    with:
      fail-under: 'rhodium'

  # The called workflow's outputs are only visible to a downstream job.
  relay:
    name: relay outputs
    needs: [pinned-score, bad-target, gate-fail]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert caller-visible results
        run: |
          set -uo pipefail
          fail=0
          report() { printf '::notice title=%s::result=%s tier=%s score=%s provisional=%s\n' "$1" "$2" "$3" "$4" "$5"; }
          report pinned     '${{ needs.pinned-score.result }}' '${{ needs.pinned-score.outputs.tier }}' '${{ needs.pinned-score.outputs.score }}' '${{ needs.pinned-score.outputs.provisional }}'
          report bad-target '${{ needs.bad-target.result }}'   '${{ needs.bad-target.outputs.tier }}'   '${{ needs.bad-target.outputs.score }}'   '${{ needs.bad-target.outputs.provisional }}'
          report gate-fail  '${{ needs.gate-fail.result }}'    '${{ needs.gate-fail.outputs.tier }}'    '${{ needs.gate-fail.outputs.score }}'    '${{ needs.gate-fail.outputs.provisional }}'

          [ '${{ needs.pinned-score.result }}' = 'success' ] || { echo "::error::pinned run did not succeed"; fail=1; }
          [ -n '${{ needs.pinned-score.outputs.tier }}' ]   || { echo "::error::pinned run published no tier"; fail=1; }
          [ '${{ needs.bad-target.result }}' = 'failure' ]  || { echo "::error::missing target did not fail"; fail=1; }
          [ -z '${{ needs.bad-target.outputs.tier }}' ]     || { echo "::error::missing target still published a tier"; fail=1; }
          [ '${{ needs.gate-fail.result }}' = 'failure' ]   || { echo "::error::fail-under gate did not fail"; fail=1; }
          [ -n '${{ needs.gate-fail.outputs.tier }}' ]      || { echo "::error::gate failure published no tier (outputs lost)"; fail=1; }
          exit "$fail"

  # The cross-repository branch-pin guard cannot be exercised from a PR: this
  # org blocks a newly added cross-repo `uses:` at startup. Test the decision
  # logic itself instead, on sample refs.
  pin-logic:
    name: pin-ref decision logic
    runs-on: ubuntu-latest
    steps:
      - name: Check the accept/reject table
        run: |
          set -euo pipefail
          try_decide() { # ref, same-repo -> 0 accept / 1 reject
            local ref="$1" self="$2" ok=0
            case "$ref" in
              refs/tags/*|v[0-9]*) ok=1 ;;
              refs/heads/*|main|master|HEAD|develop) ok=0 ;;
              *) if printf '%s' "$ref" | grep -Eq '^[0-9a-f]{7,40}$'; then ok=1; fi ;;
            esac
            if [ "$self" = "1" ]; then ok=1; fi
            [ "$ok" = "1" ]
          }
          fail=0
          expect_accept() { if ! try_decide "$1" "$2"; then echo "FAIL: expected accept: ref=$1 self=$2"; fail=1; fi; }
          expect_reject() { if try_decide "$1" "$2"; then echo "FAIL: expected reject: ref=$1 self=$2"; fail=1; fi; }

          expect_accept "9f1e2d3c4b5a69788796a5b4c3d2e1f0a1b2c3d4" 0
          expect_accept "9f1e2d3" 0
          expect_accept "refs/tags/v0.1.2" 0
          expect_accept "v0.1.2" 0
          expect_accept "refs/heads/main" 1
          expect_accept "refs/pull/956/merge" 1
          expect_reject "main" 0
          expect_reject "master" 0
          expect_reject "develop" 0
          expect_reject "HEAD" 0
          expect_reject "refs/heads/main" 0
          expect_reject "refs/heads/arena/0cc4e3dd-hypatia" 0
          expect_reject "not-a-sha" 0

          if [ "$fail" != "0" ]; then echo "::error::pin logic table failed"; exit 1; fi
          echo "::notice title=pin-logic::all 13 cases pass"
