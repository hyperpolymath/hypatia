#
# ABI codegen drift gate.
#
# Re-runs `hypatia-abi-gen` against the normative Idris2 ABI and fails if any
# generated file in the tree differs from what the generator emits now.
#
# Deliberately has NO `paths:` filter. `verify-proofs.yml` -- the obvious home
# for this job -- filters on `src/abi/**`, `src/Hypatia/ABI/**`, `verify/**`
# and friends, and lists none of the generated targets, so a hand-edit to
# `ffi/zig/src/connector_generated.zig` would not have fired it at all. An
# unfiltered workflow also stays eligible to be made a required check without
# deadlocking PRs that touch none of those paths.

name: ABI codegen drift

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  abi-codegen-drift:
    name: abi-codegen-drift
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    env:
      IDRIS2_VERSION: v0.7.0

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Chez Scheme
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y chezscheme

      - name: Cache Idris 2 install
        id: cache-idris
        uses: actions/cache@v6.1.0
        with:
          path: |
            /usr/local/bin/idris2
            /usr/local/bin/idris2_app
            /usr/local/lib/idris2
            ~/.idris2
          # Same key as verify-proofs.yml on purpose: this job shares that
          # workflow's warm cache rather than paying a second ~20-min
          # bootstrap. Keep the `-2` suffix in step with it.
          key: idris2-${{ env.IDRIS2_VERSION }}-${{ runner.os }}-2

      - name: Build Idris 2 from source
        if: steps.cache-idris.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${IDRIS2_VERSION}" \
            https://github.com/idris-lang/Idris2 /tmp/idris2
          cd /tmp/idris2
          make bootstrap SCHEME=chezscheme
          sudo make install PREFIX=/usr/local
          idris2 --version

      - name: Verify Idris is on PATH
        run: idris2 --version

      # Building and RUNNING an Idris2 executable needs the Idris2 support
      # installation: the Chez data tree at `<libdir>/support/chez/support.ss`
      # at compile time, and the compiled C library `<libdir>/lib/
      # libidris2_support.so` -- which the Chez backend copies into the
      # executable's `_app` directory -- at run time.
      #
      # Neither was present under `$(idris2 --libdir)` on this runner.
      # Measured, not supposed -- twice, on PR #811 and #817:
      #   INTERNAL ERROR: Can't find data file chez/support.ss        (compile)
      #   (while loading libidris2_support.so) cannot open shared object file
      #                                                               (run)
      #
      # Why they are missing is a PREFIX MISMATCH, not a missing install step.
      # Idris2's top-level Makefile is
      #     install: install-idris2 install-support install-libs
      # so `verify-proofs.yml`'s `sudo make install PREFIX=/usr/local` DOES
      # install support -- under `/usr/local/idris2-0.7.0/`. But the binary
      # resolves `idris2 --libdir` to `/home/runner/.idris2/idris2-0.7.0`, and
      # that job's cache `path:` list names both prefixes. Library work
      # (`idris2 --check`, `--build` on the two proof packages) never needs the
      # difference, so it went unnoticed until a job here linked an executable.
      #
      # Two rules follow, and this step obeys both:
      #   * a warm cache shared with another workflow imports that workflow's
      #     OMISSIONS as well as its contents -- ask what the populating job
      #     never did, not merely whether the key hits;
      #   * anchor on `$(idris2 --libdir)` / `$(idris2 --prefix)`, never on the
      #     PREFIX someone passed to `make install`. They can differ silently.
      #
      # Hence the upstream install targets rather than copying files by hand:
      # `make support` builds the C library, `make install-support` installs
      # both it and the data tree to `<prefix>/idris2-<version>/{lib,support}`.
      # Repairing this piece by piece is how the second failure happened; the
      # tree's own target is complete by construction. It costs seconds -- it
      # builds only `support/`, never the compiler.
      #
      # Note the repair is deliberately NOT persisted: `Post Cache` is skipped
      # on a cache hit, so this job never mutates the shared entry and redoes
      # the clone+build each run. Do not "optimise" that away -- two workflows
      # writing one cache key is how the poisoned cache of -1 happened.
      - name: Ensure the Idris2 support installation is complete
        run: |
          set -euo pipefail
          prefix="$(idris2 --prefix)"
          libdir="$(idris2 --libdir)"
          support="${libdir}/support"
          csolib="${libdir}/lib/libidris2_support.so"

          if [ -f "${support}/chez/support.ss" ] && [ -f "${csolib}" ]; then
            echo "support installation already complete under ${libdir}"
          else
            echo "incomplete support installation under ${libdir}:"
            echo "  chez/support.ss:        $([ -f "${support}/chez/support.ss" ] && echo present || echo ABSENT)"
            echo "  libidris2_support.so:   $([ -f "${csolib}" ] && echo present || echo ABSENT)"
            src="${RUNNER_TEMP}/idris2-support-src"
            rm -rf "${src}"
            git clone --depth 1 --branch "${IDRIS2_VERSION}" \
              https://github.com/idris-lang/Idris2 "${src}"
            make -C "${src}" support
            make -C "${src}" install-support PREFIX="${prefix}"
          fi

          # Assert, do not assume, and assert BOTH -- the first fix asserted
          # only the compile-time file and the job then died at run time on the
          # other one. A missing support tree surfaces three steps later as an
          # opaque INTERNAL ERROR, where it reads like a generator bug.
          missing=0
          for f in "${support}/chez/support.ss" "${csolib}"; do
            if [ ! -f "${f}" ]; then
              echo "::error::missing after install-support: ${f}"
              missing=$((missing + 1))
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            if [ -d "${libdir}" ]; then
              find "${libdir}" -maxdepth 3 \( -name 'support*' -o -name 'libidris2_support*' \) -print
            fi
            exit 1
          fi
          echo "support tree:  ${support}"
          echo "support lib:   ${csolib}"

      - name: Build the generator
        run: |
          set -euo pipefail
          cd src/abi
          idris2 --build hypatia-abi-gen.ipkg

          # Assert on the CONSUMER's artefact, not the installer's. The step
          # above already checked that `<libdir>/lib/libidris2_support.so`
          # exists; this checks the thing that actually has to load it. The
          # Chez backend COPIES that library into the executable's `_app`
          # directory at link time, and a build missing it still exits 0 --
          # the failure only appears when the binary is first run, one step
          # later, inside the comparison, where it reads as a drift failure.
          #
          # This is the guard/consumer trap: a check on the producer proves
          # nothing about the consumer. Assert what the consumer needs.
          app="../../build/abi-gen/exec/hypatia-abi-gen_app"
          if [ ! -f "${app}/libidris2_support.so" ]; then
            echo "::error::built executable is missing its runtime support library: ${app}/libidris2_support.so"
            ls -la "${app}" || true
            exit 1
          fi

          # Cheapest possible proof that the binary RUNS. `--help` exercises
          # load + argument parsing and writes nothing, so it cannot mask a
          # drift failure below by leaving output behind.
          ../../build/abi-gen/exec/hypatia-abi-gen --help

      - name: Regenerate into a temp dir and compare
        run: |
          set -euo pipefail
          # NOTE: `set -o pipefail` (via -euo) is load-bearing below. A
          # pipeline's exit status is its LAST command's, so `generator | tee`
          # would report success for a generator that died.

          OUT="${RUNNER_TEMP}/abi-gen"
          rm -rf "${OUT}"
          mkdir -p "${OUT}"

          # Regenerate into a TEMP dir, never in place. Regenerating in place
          # and running `git diff` means a generator that silently failed to
          # run leaves an empty diff -- which reads as green.
          ./build/abi-gen/exec/hypatia-abi-gen \
            --out-dir "${OUT}" \
            --abi-hash "$(git hash-object src/Hypatia/ABI/Types.idr)" \
            | tee "${RUNNER_TEMP}/gen.log"

          emitted=$(sed -n 's/^connectors emitted:[[:space:]]*//p' "${RUNNER_TEMP}/gen.log")
          emitted=${emitted:-0}

          # published path <- emitted filename
          targets="ffi/zig/src/connector_generated.zig:connector_generated.zig
          clients/rust/hypatia-client/src/connector_generated.rs:connector_generated.rs
          ffi/connectors.json:connectors.json"

          compared=0
          drifted=0
          total=0
          for pair in ${targets}; do
            total=$((total + 1))
            tracked=${pair%%:*}
            emitted_file="${OUT}/${pair##*:}"

            if [ ! -f "${tracked}" ]; then
              echo "::error::tracked file missing: ${tracked}"
              drifted=$((drifted + 1))
              continue
            fi
            if [ ! -s "${emitted_file}" ]; then
              echo "::error::generator emitted nothing for ${tracked} (${emitted_file} missing or zero bytes)"
              drifted=$((drifted + 1))
              continue
            fi

            compared=$((compared + 1))
            if diff -u "${tracked}" "${emitted_file}"; then
              echo "✓ ${tracked}"
            else
              echo "::error::${tracked} is out of date -- run \`just abi-gen\` and commit the result"
              drifted=$((drifted + 1))
            fi
          done

          # The denominator. A gate that cannot state how much it checked is
          # not evidence -- an empty output dir must fail loudly, not print
          # "ok" because the comparison loop had nothing to iterate over.
          echo "connectors emitted: ${emitted}"
          echo "files compared:     ${compared} of ${total}"
          {
            echo "### ABI codegen drift"
            echo ""
            echo "- connectors emitted: \`${emitted}\`"
            echo "- files compared: \`${compared} of ${total}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${emitted}" -eq 0 ]; then
            echo "::error::generator emitted 0 connectors -- it did not run, or the ABI is empty"
            exit 1
          fi
          if [ "${compared}" -ne "${total}" ]; then
            echo "::error::compared ${compared} of ${total} generated files"
            exit 1
          fi
          if [ "${drifted}" -ne 0 ]; then
            echo "::error::${drifted} generated file(s) drifted from the Idris2 ABI"
            exit 1
          fi
          echo "No drift: every generated file matches src/Hypatia/ABI/Types.idr"
