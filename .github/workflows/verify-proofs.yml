# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
# Consolidated workflow (behaviour-preserving merge).
# Merged from: verify-idris.yml, verify-lean.yml, verify-tlaplus.yml
name: Verify Proofs (Idris / Lean / TLA+ / Agda)

on:
  push:
    paths:
    - .github/workflows/verify-proofs.yml
    - Justfile
    - pack.toml
    - verification/proofs/idris2/**
    - verification/proofs/tlaplus/**
    - verification/proofs/agda/**
    - verification/PROOF-STATUS.adoc
    - scripts/check-proof-status.sh
    - verification/proof-ledger.jsonl
    - scripts/proof-ledger.sh
    - scripts/proof-ledger-ci.sh
    - tests/proof-ledger-test.sh
    - README.adoc
    - AFFIRMATION.adoc
    - EXPLAINME.adoc
    - scripts/check-trusted-base.sh
    - docs/proof-debt.adoc
    - test/soundness/**
    - src/abi/**
    - src/Hypatia/ABI/**
    - verify/**
    - tests/accept/**
    - tests/reject/**
    - scripts/check-verdicts.sh
    - scripts/recheck-lean-hole.sh
    - scripts/fetch-siblings.sh
    - scripts/check-sibling-citations.sh
    branches:
    - main
  pull_request:
    paths:
    - .github/workflows/verify-proofs.yml
    - Justfile
    - pack.toml
    - verification/proofs/idris2/**
    - verification/proofs/tlaplus/**
    - verification/proofs/agda/**
    - verification/PROOF-STATUS.adoc
    - scripts/check-proof-status.sh
    - verification/proof-ledger.jsonl
    - scripts/proof-ledger.sh
    - scripts/proof-ledger-ci.sh
    - tests/proof-ledger-test.sh
    - README.adoc
    - AFFIRMATION.adoc
    - EXPLAINME.adoc
    - scripts/check-trusted-base.sh
    - docs/proof-debt.adoc
    - test/soundness/**
    - src/abi/**
    - src/Hypatia/ABI/**
    - verify/**
    - tests/accept/**
    - tests/reject/**
    - scripts/check-verdicts.sh
    - scripts/recheck-lean-hole.sh
    - scripts/fetch-siblings.sh
    - scripts/check-sibling-citations.sh
    branches:
    - main
  schedule:
  # Weekly Monday 04:00 UTC — single trigger. The three crons (04:00,
  # 04:30, 05:00) were inherited from the pre-consolidation
  # verify-{idris,lean,tlaplus}.yml workflows and fired the now-merged
  # workflow three times every Monday. Collapsed to one.
  - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  type-check:
    name: idris2 --check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    env:
      IDRIS2_VERSION: v0.7.0
      # Receipts this job writes; the last step derives the ledger's idris2
      # and verdicts rows from them (scripts/proof-ledger.sh derive).
      PROOF_RECEIPTS: /tmp/proof-receipts.jsonl

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Chez Scheme
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y chezscheme

      # The cached ~/.idris2 holds a Chez-compiled idris2.so. A fasl-object
      # is only loadable by the Chez that wrote it, and `ubuntu-latest` moved
      # to a newer image (26.04) with a newer Chez, so the old cache restored
      # an idris2.so the new Chez refuses:
      #   Exception: incompatible fasl-object version 0.0.0-pre-release.73
      # The installed chezscheme package version is therefore part of the key,
      # so an image or package bump rebuilds Idris 2 instead of loading a stale
      # build. Keep this step and the key in step with abi-codegen-drift.yml /
      # verify-proofs.yml, which share one cache entry on purpose.
      - name: Chez Scheme version (Idris 2 cache key)
        id: chez
        run: |
          set -euo pipefail
          v="$(dpkg-query -W -f='${Version}' chezscheme | tr -c 'A-Za-z0-9.' '-')"
          [ -n "$v" ]
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Cache Idris 2 install
        id: cache-idris
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.idris2
          # ONE prefix (#820). The old cache hedged across /usr/local AND
          # ~/.idris2 because the bootstrap split the world in two; the old
          # entries are populated under that split layout, so the key is
          # bumped to -3 to discard them. Only the prefix the binary
          # actually reads is cached now.
          # `idris2` is only a launcher script; it execs its sibling
          # idris2_app/idris2.so. An earlier cache omitted idris2_app/, so
          # every cache *hit* restored a launcher with no image and died
          # with `idris2_app/idris2.so: not found` (exit 127) before any
          # proof ran. ~/.idris2/bin/{idris2,idris2_app} travels together.
          key: idris2-${{ env.IDRIS2_VERSION }}-${{ runner.os }}-chez${{ steps.chez.outputs.version }}-3

      - name: Build Idris 2 from source
        if: steps.cache-idris.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${IDRIS2_VERSION}" \
            https://github.com/idris-lang/Idris2 /tmp/idris2
          cd /tmp/idris2
          make bootstrap SCHEME=chezscheme
          # ONE prefix (#820): `make bootstrap` bakes the DEFAULT prefix
          # ($HOME/.idris2) into the binary, so install there too. The old
          # `sudo make install PREFIX=/usr/local` wrote the trees under
          # /usr/local while the binary resolved `--libdir` to
          # ~/.idris2/idris2-0.7.0 -- which held neither
          # support/chez/support.ss nor lib/libidris2_support.so. Pure
          # library work (--check, --build of .ipkg) never links an
          # executable and so never noticed; the first job that ran a
          # binary died with "INTERNAL ERROR: Can't find data file
          # chez/support.ss". Installing to the prefix the binary reads
          # removes the mismatch and the need for sudo.
          make install PREFIX="$HOME/.idris2"
          # Not yet on PATH (the next step adds it): call it by its full path.
          "$HOME/.idris2/bin/idris2" --version

      - name: Put Idris 2 on PATH
        run: echo "$HOME/.idris2/bin" >> "$GITHUB_PATH"

      # #820 AC1: measure, do not infer. This step prints what prefix the
      # binary reports and what each candidate location actually holds, so
      # the layout question is answered by a run rather than by a comment.
      - name: Measure Idris2 prefix layout
        run: |
          set -uo pipefail
          echo "idris2 --prefix : $(idris2 --prefix 2>&1)"
          echo "idris2 --libdir : $(idris2 --libdir 2>&1)"
          echo "--- /usr/local/idris2-0.7.0/ ---"; ls /usr/local/idris2-0.7.0/ 2>&1 || echo "ABSENT"
          echo "--- ~/.idris2/idris2-0.7.0/ ---"; ls ~/.idris2/idris2-0.7.0/ 2>&1 || echo "ABSENT"
          echo "--- artefacts the executable path needs ---"
          ls "$(idris2 --libdir)/support/chez/support.ss" 2>&1 || echo "MISSING: <libdir>/support/chez/support.ss"
          ls "$(idris2 --libdir)/lib/libidris2_support.so" 2>&1 || echo "MISSING: <libdir>/lib/libidris2_support.so"

      - name: Verify Idris is on PATH
        run: idris2 --version

      - name: Type-check every .idr proof file
        working-directory: verification/proofs/idris2
        run: |
          set -euo pipefail
          failed=0
          for f in *.idr; do
            echo "── $f ─────────────────────────────────────────────"
            if idris2 --check "$f"; then
              echo "✓ $f"
              bash "$GITHUB_WORKSPACE/scripts/proof-ledger.sh" receipt idris2 pass "verification/proofs/idris2/$f"
            else
              echo "✗ $f"
              bash "$GITHUB_WORKSPACE/scripts/proof-ledger.sh" receipt idris2 fail "verification/proofs/idris2/$f"
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed Idris proof file(s) failed to type-check"
            exit 1
          fi

      # The standalone files above are only half the Idris proof surface. The
      # richest proofs (RuleEngine's safety-triangle / dispatch / Bayesian
      # monotonicity, the FFI ApiResponse proof, the pipeline state machine)
      # live in the ABI and verify *packages*, which the per-file --check loop
      # never builds. Gate them here so they can't silently rot again.
      - name: Build the ABI proof package (Types, GraphQL, gRPC, REST, FFI, RuleEngine)
        run: bash scripts/proof-ledger-ci.sh ipkg src/abi/hypatia-abi.ipkg

      - name: Build the verify package (PipelineState, Verify.Fuel)
        run: bash scripts/proof-ledger-ci.sh ipkg verify/hypatia-verify.ipkg

      # HYP-01: Verdict.idr claims a `Sound` verdict is constructible only
      # from a confirming prover re-check. The typechecker is the falsifier:
      # tests/accept/ must be accepted, and every tests/reject/ module must be
      # refused at `invalid` with the diagnostic its `-- EXPECT:` line names.
      - name: Verdict accept/reject fixtures (HYP-01)
        run: bash scripts/proof-ledger-ci.sh verdicts

      # The ledger is canonical, but its statuses are not typed in: every row
      # in these lanes must say exactly what this run's receipts make it. An
      # overclaim and a stale underclaim both fail (owner ruling 2026-11-09).
      - name: Ledger statuses agree with this run (idris2, verdicts)
        if: always()
        run: bash scripts/proof-ledger.sh derive idris2,verdicts "$PROOF_RECEIPTS"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Idris 2 proof verification"
            echo ""
            echo "- Toolchain: Idris 2 \`${IDRIS2_VERSION}\` (from source, Chez Scheme backend)"
            echo "- Proof files checked:"
            for f in verification/proofs/idris2/*.idr; do
              echo "  - \`$(basename "$f")\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # Lean is no longer a proof lane here: the engineering proofs it held moved
  # to Idris2 (PROOF-POLICY section 3; verification/proofs/idris2/). It stays
  # for the HYP-01 positive control, which re-runs Lean on a fixture.
  lean-hole-recheck:
    name: Lean hole re-check (HYP-01 control)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    env:
      ELAN_VERSION: v4.0.0
      # Pinned (not :stable): tests/accept/LeanHoleRecheckSound.idr records
      # the Lean version whose output it digests.
      LEAN_TOOLCHAIN: leanprover/lean4:v4.30.0

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Cache Lean toolchain
        id: cache-lean
        uses: actions/cache@v6.1.0
        with:
          path: ~/.elan
          key: lean-${{ env.ELAN_VERSION }}-${{ env.LEAN_TOOLCHAIN }}-toolchain

      - name: Install elan + Lean 4
        if: steps.cache-lean.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fL -o /tmp/elan-init.sh "https://raw.githubusercontent.com/leanprover/elan/${ELAN_VERSION}/elan-init.sh"
          sh /tmp/elan-init.sh -y --default-toolchain "${LEAN_TOOLCHAIN}" --no-modify-path

      - name: Put elan on PATH
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # HYP-01 positive control: the SoundVerdict in
      # tests/accept/LeanHoleRecheckSound.idr records digests of a Lean run.
      # Re-run Lean on the fixture from the repository root (where the
      # control's paths are relative to) and require both digests to match.
      - name: Re-check the Lean proof-hole fixture against the HYP-01 control
        run: |
          set -euo pipefail
          lean --version
          bash scripts/recheck-lean-hole.sh

      - name: Summary
        if: always()
        run: |
          {
            echo "## Lean (HYP-01 positive control)"
            echo ""
            echo "- Toolchain: \`${LEAN_TOOLCHAIN}\` via elan \`${ELAN_VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Estate PROOF-POLICY / Mathesis Grade 3 gate for the one Agda artefact:
  # a missing or failing checker is a hard failure, never a skip. The file
  # imports only Agda builtins, so no standard-library dependency is
  # involved. A green run is the receipt material for the PROOF-STATUS
  # Grade 3 / AGDA-VERIFIED row; it does not by itself claim Grade 2/1
  # reconciliation or runtime refinement.
  agda-check:
    name: agda strict-profile check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    env:
      # Latest stable Agda release at implementation time, pinned so the
      # Grade 3 receipt names an exact checker (estate PROOF-POLICY).
      # Deliberately not the runner's APT package, whose version floats.
      AGDA_VERSION: 2.8.0.2
      PROOF_RECEIPTS: /tmp/proof-receipts.jsonl

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Agda (official pinned release)
        run: |
          set -euo pipefail
          asset="Agda-v${AGDA_VERSION}-linux.tar.xz"
          curl --proto '=https' --proto-redir '=https' -fL --retry 3 -o "/tmp/${asset}" \
            "https://github.com/agda/agda/releases/download/v${AGDA_VERSION}/${asset}"
          install_root="$HOME/.local/opt/agda-${AGDA_VERSION}"
          rm -rf "$install_root"
          mkdir -p "$install_root"
          tar -xJf "/tmp/${asset}" -C "$install_root"
          # The official tarball is a flat archive containing ./agda
          # (see agda/agda .github/workflows/deploy.yml), not bin/agda.
          agda_bin="$(find "$install_root" -type f -name agda | head -1)"
          [ -n "$agda_bin" ]
          chmod +x "$agda_bin"
          echo "$(dirname "$agda_bin")" >> "$GITHUB_PATH"
          "$agda_bin" --version

      - name: Check LogtalkMigration.agda (strict profile)
        working-directory: verification/proofs/agda
        run: |
          set -euo pipefail
          agda --version
          sha256sum LogtalkMigration.agda
          if agda --safe --without-K --cubical-compatible LogtalkMigration.agda; then
            bash "$GITHUB_WORKSPACE/scripts/proof-ledger.sh" receipt agda pass verification/proofs/agda/LogtalkMigration.agda -- checker="Agda $AGDA_VERSION"
          else
            bash "$GITHUB_WORKSPACE/scripts/proof-ledger.sh" receipt agda fail verification/proofs/agda/LogtalkMigration.agda
            exit 1
          fi

      - name: Ledger statuses agree with this run (agda)
        if: always()
        run: bash scripts/proof-ledger.sh derive agda "$PROOF_RECEIPTS"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Agda proof verification"
            echo ""
            echo "- Invocation: \`agda --safe --without-K --cubical-compatible LogtalkMigration.agda\`"
            if command -v agda >/dev/null 2>&1; then
              echo "- Checker: \`$(agda --version | head -1)\`"
            fi
            echo "- Source SHA-256: \`$(sha256sum verification/proofs/agda/LogtalkMigration.agda | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

  tlc:
    name: TLC model-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      # Pinned: `releases/latest` moves, and the v1.8.0 tag is a rolling
      # nightly. v1.7.4 is TLC 2.19 (rev 5a47802), the checker the ledger's
      # KinGate bounds were measured with.
      TLA2TOOLS_TAG: v1.7.4
      TLA2TOOLS_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
      PROOF_RECEIPTS: /tmp/proof-receipts.jsonl

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Eclipse Temurin 21 JRE
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache tla2tools.jar
        id: cache-tla
        uses: actions/cache@v6.1.0
        with:
          path: ~/.local/share/tla2tools.jar
          key: tla2tools-${{ env.TLA2TOOLS_TAG }}-${{ env.TLA2TOOLS_SHA256 }}

      - name: Fetch tla2tools.jar
        if: steps.cache-tla.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.local/share
          curl --proto '=https' -fsSL -o ~/.local/share/tla2tools.jar \
            "https://github.com/tlaplus/tlaplus/releases/download/${TLA2TOOLS_TAG}/tla2tools.jar"

      - name: Verify the tla2tools.jar digest
        run: echo "${TLA2TOOLS_SHA256}  $HOME/.local/share/tla2tools.jar" | sha256sum -c -

      # Fails if TLC prints an error or does not declare completion; the
      # receipt carries the distinct-state count and depth.
      - name: Model-check KinGate (H8)
        run: |
          TLA2TOOLS_JAR="$HOME/.local/share/tla2tools.jar" \
            bash scripts/proof-ledger-ci.sh tlc verification/proofs/tlaplus/KinGate.tla verification/proofs/tlaplus/KinGate.cfg

      - name: Ledger statuses agree with this run (tlc)
        if: always()
        run: bash scripts/proof-ledger.sh derive tlc "$PROOF_RECEIPTS"

      - name: Upload TLC log on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tlc-log
          path: verification/proofs/tlaplus/tlc.log
          retention-days: 14

  # --------------------------------------------------------------------------
  # Currency gates for the two status documents. A proof-status document that
  # is wrong is worse than one that is missing: it is read as evidence (#816,
  # #831). Both scripts are proven by mutant (rename a proof / plant an
  # un-annotated marker -> red; revert -> green).
  # --------------------------------------------------------------------------

  proof-status:
    name: PROOF-STATUS currency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: PROOF-STATUS.adoc agrees with the tree
        run: bash scripts/check-proof-status.sh

      # The machine ledger is canonical (README-EXPLAINME section 5): it must
      # obey its rules and the tree, and the Proof Ledger table must be its
      # rendering. The contracts plant each defect the check exists to catch.
      - name: Proof ledger is valid and agrees with the tree
        run: bash scripts/proof-ledger.sh check

      - name: Proof Ledger table is the ledger's rendering
        run: bash scripts/proof-ledger.sh render --check

      - name: Every quoted census is the ledger's
        run: bash scripts/proof-ledger.sh claims

      - name: Proof ledger contracts (planted defects)
        run: bash tests/proof-ledger-test.sh

  check-trusted-base:
    name: check-trusted-base
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: No un-annotated trusted-base markers
        run: bash scripts/check-trusted-base.sh

  # Sibling proof repos are consumed by pinned commit, never re-declared. The
  # Idris2 records that follow them are transcriptions (correspondence
  # ASSUMED); this job keeps the citation itself honest: the pin fetches,
  # the cited definitions exist at it, and the citing header names it.
  sibling-citations:
    name: sibling citations at pin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Fetch pinned siblings
        run: bash scripts/fetch-siblings.sh

      - name: Every citation resolves at its pin
        run: bash scripts/check-sibling-citations.sh
