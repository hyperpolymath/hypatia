# This workflow is managed by gh actions-lock.
name: Governance

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    # Published standards PR #1418 includes the corrected reviewer coverage
    # and retains #1394's exact ClusterFuzzLite authority. All five callers
    # share this pin; actions.lock is generated by the canonical tooling.
    uses: metadatastician/standards/.github/workflows/governance-reusable.yml@7641c7fdb01420696b5420ab85d88f599f32f609
    # Scanner pin: hypatia scans itself with its own main branch. On a PR that
    # is the base commit; on push, schedule or dispatch it is the commit being
    # run. It is never the PR head, so a PR cannot weaken the rules that gate
    # it. Each merged rule fix reaches this gate with no hand bump. If main
    # ships a broken rule, the PR that fixes it can pin a known-good 40-hex
    # SHA here temporarily. Other repos keep the reusable's vetted default.
    with:
      hypatia-ref: ${{ github.event.pull_request.base.sha || github.sha }}
    permissions:
      actions: read
      contents: read
      security-events: write
