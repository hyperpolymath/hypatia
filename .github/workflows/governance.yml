name: Governance

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  governance:
    uses: metadatastician/standards/.github/workflows/governance-reusable.yml@1725bebd3773ea25627479f813283abf1c497a85
    # Scanner pin: hypatia scans itself with its own main branch. On a PR that
    # is the base commit; on push, schedule or dispatch it is the commit being
    # run. It is never the PR head, so a PR cannot weaken the rules that gate
    # it. Each merged rule fix reaches this gate with no hand bump. If main
    # ships a broken rule, the PR that fixes it can pin a known-good 40-hex
    # SHA here temporarily. Other repos keep the reusable's vetted default.
    with:
      hypatia-ref: ${{ github.event.pull_request.base.sha || github.sha }}
    permissions:
      actions: read
      contents: read
      security-events: write
