# This workflow is managed by gh actions-lock.
name: Hypatia Security Scan

on:
  push:
    branches: [main, master, develop]
  # No `branches:` filter — a required check whose workflow is branch-gated is
  # never created on a non-matching base and blocks merge forever at
  # "Expected — Waiting for status to be reported" (cf. affinescript#645).
  pull_request:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  hypatia:
    uses: metadatastician/standards/.github/workflows/hypatia-scan-reusable.yml@1725bebd3773ea25627479f813283abf1c497a85
    # Scanner pin: hypatia's own main branch, never the PR head. See governance.yml.
    with:
      hypatia-ref: ${{ github.event.pull_request.base.sha || github.sha }}
    # Only the one secret the callee declares (standards#1108 §6b).
    secrets:
      HYPATIA_SCAN_PAT: ${{ secrets.HYPATIA_SCAN_PAT }}
