name: Hypatia Security Scan

on:
  push:
    branches: [main, master, develop]
  # No `branches:` filter — a required check whose workflow is branch-gated is
  # never created on a non-matching base and blocks merge forever at
  # "Expected — Waiting for status to be reported" (cf. affinescript#645).
  pull_request:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  hypatia:
    uses: hyperpolymath/standards/.github/workflows/hypatia-scan-reusable.yml@da2c748aad55c1a1dcba00b60fe4a35017bc6540
    secrets: inherit
