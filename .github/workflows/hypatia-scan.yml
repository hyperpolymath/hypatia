# SPDX-License-Identifier: PMPL-1.0-or-later
name: Hypatia Security Scan

on:
  push:
    branches: [main, master, develop]
  # No `branches:` filter — a required check whose workflow is branch-gated is
  # never created on a non-matching base and blocks merge forever at
  # "Expected — Waiting for status to be reported" (cf. affinescript#645).
  pull_request:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  hypatia:
    uses: hyperpolymath/standards/.github/workflows/hypatia-scan-reusable.yml@abd93c3c3b8b3fce6843bafde2b3cc78359ebdab
    secrets: inherit
    timeout-minutes: 15
