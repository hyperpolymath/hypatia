# This workflow is managed by gh actions-lock.
name: Hypatia Security Scan

on:
  push:
    branches: [main, master, develop]
  # No `branches:` filter — a required check whose workflow is branch-gated is
  # never created on a non-matching base and blocks merge forever at
  # "Expected — Waiting for status to be reported" (cf. affinescript#645).
  pull_request:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  hypatia:
    uses: hyperpolymath/standards/.github/workflows/hypatia-scan-reusable.yml@333b06a01db1874ffedb2de1bfabb195640927c7
    # Scanner pin: see governance.yml. Drop once `uses:` is re-pinned.
    with:
      hypatia-ref: aa34a4cc6ba39d873710ff39763fdb9cde715f9d
    # Only the one secret the callee declares (standards#1108 §6b).
    secrets:
      HYPATIA_SCAN_PAT: ${{ secrets.HYPATIA_SCAN_PAT }}
