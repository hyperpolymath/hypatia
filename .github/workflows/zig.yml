#
# Zig wire-contract tests.
#
# Scope is deliberately narrow: `zig test ffi/zig/src/unified-api-adapter.zig`,
# NOT `zig build test`.
#
# Why. The adapter carries the `comptime` 16-connector assertion and the four
# wire-contract tests, and it was reachable from no test root at all -- none of
# `main.zig`, `json_writer.zig`, `file_ops.zig` or `test/integration_test.zig`
# imports it -- so those assertions had never executed anywhere, locally or in
# CI. `build.zig` now roots it too, but `zig build test` is independently RED
# on `main` for pre-existing reasons (below), so gating on the whole build
# would land a workflow that is red on arrival and says nothing about this
# contract.
#
# Measured 2026-09-22 with Zig 0.16.0: `zig build test` reports
# "4/11 steps succeeded (3 failed); 7/7 tests passed". Three of the four
# pre-existing roots (main.zig, file_ops.zig, test/integration_test.zig) fail to
# COMPILE against the 0.16 standard library -- 16 call sites across six removed
# or relocated symbols (std.fs.cwd, std.posix.getenv, std.fs.openFileAbsolute,
# std.fs.createFileAbsolute, std.fs.deleteFileAbsolute, std.time.timestamp),
# plus an `opaque` type declared with fields at main.zig:46. That is a
# pre-existing un-migrated tree, not a regression from this change.
#
# The 7 passing tests are json_writer.zig's 3 and this adapter's 4 -- so
# adding the adapter root took `zig build test` from 3 tests to 7.
#
# This job runs the maximal subset that is green today. Widen it to
# `zig build test` once the tree is migrated to the 0.16 std API.
#
# No `paths:` filter, deliberately -- so it stays eligible to be made a
# required check without the filter/required deadlock.

name: Zig

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  zig-test:
    name: zig test (wire contract)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    env:
      # Matches the owner's local toolchain
      # (developer/tools/opt/mise/installs/zig/0.16.0).
      ZIG_VERSION: '0.16.0'
      # Official shasum for zig-x86_64-linux-0.16.0.tar.xz. Pinned rather than
      # installed via a third-party action: it adds no `uses:` entry to
      # actions.lock, and it cannot float the way `mise.toml`'s `zig = "latest"`
      # does.
      ZIG_SHA256: '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00'

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Cache the Zig toolchain
        id: cache-zig
        uses: actions/cache@v6.1.0
        with:
          path: ~/.local/zig
          key: zig-${{ env.ZIG_VERSION }}-x86_64-linux-${{ env.ZIG_SHA256 }}

      - name: Install Zig
        if: steps.cache-zig.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          tarball="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -fsSL -o "/tmp/${tarball}" \
            "https://ziglang.org/download/${ZIG_VERSION}/${tarball}"
          echo "${ZIG_SHA256}  /tmp/${tarball}" | sha256sum -c -
          mkdir -p ~/.local/zig
          tar -xJf "/tmp/${tarball}" -C ~/.local/zig --strip-components=1

      - name: Put Zig on PATH
        run: echo "$HOME/.local/zig" >> "$GITHUB_PATH"

      - name: Verify the toolchain
        run: |
          set -euo pipefail
          zig version
          test "$(zig version)" = "${ZIG_VERSION}"

      - name: Run the wire-contract tests
        run: |
          set -euo pipefail
          # `zig test` writes its summary to stderr; keep both streams.
          zig test ffi/zig/src/unified-api-adapter.zig 2>&1 | tee "${RUNNER_TEMP}/zig-test.log"

          # The denominator. `zig test` on a file containing no `test` blocks
          # exits 0 -- a green tick that proves nothing. Insist that it says
          # how many it ran, and that the number is not zero.
          summary=$(grep -Eo '[0-9]+ of [0-9]+ test[s]? passed|All [0-9]+ tests passed' \
            "${RUNNER_TEMP}/zig-test.log" | tail -1 || true)
          count=$(printf '%s' "${summary}" | grep -Eo '[0-9]+' | tail -1 || true)
          count=${count:-0}

          echo "zig tests run: ${count}"
          {
            echo "### Zig wire contract"
            echo ""
            echo "- root: \`ffi/zig/src/unified-api-adapter.zig\`"
            echo "- tests run: \`${count}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${count}" -lt 1 ]; then
            echo "::error::zig test reported ${count} tests -- the wire-contract tests did not run"
            exit 1
          fi
