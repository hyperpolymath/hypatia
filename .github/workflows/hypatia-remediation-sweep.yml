# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
# Hypatia Remediation Sweep — fleet-wide proactive scan
#
# hypatia-scan.yml runs per-repo on push/PR/weekly and produces findings.
# This workflow runs centrally, walks every repo with open Dependabot
# alerts under the owner, and dispatches a `hypatia-security-alert`
# repository_dispatch event to gitbot-fleet for each. The existing
# `hypatia-dispatch-intake.yml` workflow in gitbot-fleet then routes
# the findings to the appropriate fix-* script.
#
# Closes the loop documented in the 2026-05-12 dependabot-automation-gap
# audit: the remediation pipeline existed in code (fleet_dispatcher.ex
# + fix-dependabot.sh + dispatch-runner.sh) but had no scheduled
# fleet-wide trigger. This is that trigger.

name: Hypatia Remediation Sweep

on:
  schedule:
    # Daily at 03:17 UTC — staggered off the Sunday maintenance.yml run
    # in .git-private-farm to avoid token-rate-limit collisions.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      owner:
        description: 'GitHub owner/org to sweep (default: hyperpolymath)'
        required: false
        default: 'hyperpolymath'
        type: string
      dry_run:
        description: 'Log targets without dispatching'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      severity_floor:
        description: 'Minimum severity to dispatch (LOW|MODERATE|HIGH|CRITICAL)'
        required: false
        default: 'MODERATE'
        type: choice
        options:
          - LOW
          - MODERATE
          - HIGH
          - CRITICAL

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    name: Sweep fleet for vulnerable repos
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: block
          # gh against the GitHub API, plus the artifact service and its blob
          # storage for the target-list upload.
          allowed-endpoints: >
            api.github.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Resolve inputs
        id: cfg
        run: |
          OWNER="${{ inputs.owner || 'hyperpolymath' }}"
          DRY="${{ inputs.dry_run || 'false' }}"
          FLOOR="${{ inputs.severity_floor || 'MODERATE' }}"
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          echo "dry=$DRY"     >> "$GITHUB_OUTPUT"
          echo "floor=$FLOOR" >> "$GITHUB_OUTPUT"

      - name: Query repos with open vulnerability alerts
        id: query
        env:
          # Read-only scanner credential: Contents and Dependabot alerts read.
          # Dispatch credentials must not be used to read security findings.
          GH_TOKEN: ${{ secrets.HYPATIA_SCAN_PAT }}
          OWNER: ${{ steps.cfg.outputs.owner }}
        run: |
          set -euo pipefail
          : > /tmp/repos.jsonl
          : > /tmp/unreadable.txt

          # One REST call per repository. The single GraphQL query this
          # replaces asked for 100 repositories with 100 alerts each per page
          # and GitHub answered it with HTTP 502 (runs 43988746284 and its
          # re-run). Each line of /tmp/repos.jsonl keeps the shape that query
          # gave, so the filter below is unchanged. REST names severities
          # low/medium/high/critical; GraphQL named them LOW/MODERATE/HIGH/
          # CRITICAL, so medium becomes MODERATE.
          gh api --paginate "users/$OWNER/repos?type=owner&per_page=100" \
            --jq '.[] | select(.fork == false) | [.name, .archived] | @tsv' > /tmp/owned.tsv

          while IFS=$'\t' read -r NAME ARCHIVED; do
            [[ "$ARCHIVED" == "true" ]] && continue
            if ! gh api --paginate "repos/$OWNER/$NAME/dependabot/alerts?state=open&per_page=100" \
                --jq '.[]' > /tmp/alerts.json 2> /tmp/alerts.err; then
              # Alerts that cannot be read are not "no alerts": keep the repo
              # and its error, and report both below.
              printf '%s\t%s\n' "$NAME" "$(tr '\n' ' ' < /tmp/alerts.err)" >> /tmp/unreadable.txt
              continue
            fi
            jq -cs --arg name "$NAME" '{
              name: $name,
              isArchived: false,
              vulnerabilityAlerts: {
                totalCount: length,
                nodes: map({
                  createdAt: .created_at,
                  securityVulnerability: {
                    severity: (.security_advisory.severity | ascii_upcase
                               | if . == "MEDIUM" then "MODERATE" else . end),
                    package: .security_vulnerability.package,
                    advisory: {ghsaId: .security_advisory.ghsa_id,
                               summary: .security_advisory.summary},
                    vulnerableVersionRange: .security_vulnerability.vulnerable_version_range,
                    firstPatchedVersion: .security_vulnerability.first_patched_version
                  }
                })
              }
            }' /tmp/alerts.json >> /tmp/repos.jsonl
          done < /tmp/owned.tsv

          READ=$(wc -l < /tmp/repos.jsonl)
          UNREADABLE=$(wc -l < /tmp/unreadable.txt)
          echo "Read Dependabot alerts for $READ repositories; $UNREADABLE could not be read."
          if [[ "$UNREADABLE" -gt 0 ]]; then
            echo "::warning title=Dependabot alerts not readable::$UNREADABLE repositories (listed in the step summary)"
          fi
          if [[ "$READ" -eq 0 ]]; then
            echo "::error title=No Dependabot alerts read::not one repository could be read, so this sweep would report nothing"
            exit 1
          fi

          # Filter: non-archived, has alerts, at least one alert at/above floor.
          FLOOR='${{ steps.cfg.outputs.floor }}'
          # Severity ordering: LOW=1, MODERATE=2, HIGH=3, CRITICAL=4
          FLOOR_RANK=$(jq -rn --arg f "$FLOOR" '{"LOW":1,"MODERATE":2,"HIGH":3,"CRITICAL":4}[$f]')

          jq -c --argjson floor "$FLOOR_RANK" '
            select(.isArchived == false)
            | select(.vulnerabilityAlerts.totalCount > 0)
            | . as $r
            | ($r.vulnerabilityAlerts.nodes
                | map({"LOW":1,"MODERATE":2,"HIGH":3,"CRITICAL":4}[.securityVulnerability.severity] // 0)
                | max) as $max_rank
            | select($max_rank >= $floor)
            | {
                name,
                alert_count: .vulnerabilityAlerts.totalCount,
                top_severity: ($r.vulnerabilityAlerts.nodes
                  | map(.securityVulnerability.severity)
                  | unique
                  | sort_by({"LOW":1,"MODERATE":2,"HIGH":3,"CRITICAL":4}[.] // 0)
                  | reverse
                  | first),
                alerts: ($r.vulnerabilityAlerts.nodes | map({
                  severity: .securityVulnerability.severity,
                  package: .securityVulnerability.package.name,
                  ecosystem: .securityVulnerability.package.ecosystem,
                  ghsa: .securityVulnerability.advisory.ghsaId,
                  range: .securityVulnerability.vulnerableVersionRange,
                  patched: (.securityVulnerability.firstPatchedVersion.identifier // null)
                }))
              }
          ' /tmp/repos.jsonl > /tmp/targets.jsonl

          COUNT=$(wc -l < /tmp/targets.jsonl)
          echo "target_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "## Hypatia Remediation Sweep" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Owner: \`$OWNER\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Severity floor: \`$FLOOR\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target repos: **$COUNT**" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "- Repos read: **$READ**; not readable: **$UNREADABLE**"
            if [[ "$UNREADABLE" -gt 0 ]]; then
              echo ""
              echo "Not readable (Dependabot alerts off, or no access):"
              cut -f1 /tmp/unreadable.txt | sed 's/^/- /'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$COUNT" -gt 0 ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Repo | Alerts | Top |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---:|---|" >> "$GITHUB_STEP_SUMMARY"
            jq -r '"| \(.name) | \(.alert_count) | \(.top_severity) |"' /tmp/targets.jsonl \
              | sort -t'|' -k3 -nr >> "$GITHUB_STEP_SUMMARY"
          fi

      # Short-lived (1 h) installation token for the one repository this step
      # writes to, replacing the long-lived HYPATIA_DISPATCH_PAT.
      - name: Mint dispatch token (GitHub App)
        id: dispatch_app
        if: steps.query.outputs.target_count != '0' && steps.cfg.outputs.dry != 'true'
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ secrets.HYPATIA_APP_ID }}
          private-key: ${{ secrets.HYPATIA_APP_PRIVATE_KEY }}
          owner: hyperpolymath
          repositories: gitbot-fleet
          permission-contents: write  # repository_dispatch needs Contents: write

      - name: Dispatch findings to gitbot-fleet
        if: steps.query.outputs.target_count != '0' && steps.cfg.outputs.dry != 'true'
        env:
          GH_TOKEN: ${{ steps.dispatch_app.outputs.token }}
          OWNER: ${{ steps.cfg.outputs.owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          DISPATCHED=0
          FAILED=0
          while IFS= read -r target; do
            REPO=$(echo "$target" | jq -r '.name')
            COUNT=$(echo "$target" | jq -r '.alert_count')
            TOP=$(echo "$target" | jq -r '.top_severity')

            PAYLOAD=$(jq -nc \
              --arg source_repo "$OWNER/$REPO" \
              --arg run_url "$RUN_URL" \
              --argjson count "$COUNT" \
              --arg top_severity "$TOP" \
              --argjson alerts "$(echo "$target" | jq '.alerts')" \
              '{
                event_type: "hypatia-security-alert",
                client_payload: {
                  source_repo: $source_repo,
                  source: "hypatia-remediation-sweep",
                  scan_kind: "fleet_dependabot_sweep",
                  run_url: $run_url,
                  findings_count: $count,
                  top_severity: $top_severity,
                  findings: $alerts
                }
              }')

            if gh api -X POST \
                "/repos/hyperpolymath/gitbot-fleet/dispatches" \
                --input - <<<"$PAYLOAD" >/dev/null 2>&1; then
              DISPATCHED=$((DISPATCHED+1))
              echo "  dispatched: $REPO ($COUNT alerts, top=$TOP)"
            else
              FAILED=$((FAILED+1))
              echo "::warning::dispatch failed for $REPO"
            fi
          done < /tmp/targets.jsonl

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Dispatched: $DISPATCHED · Failed: $FAILED**" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$FAILED" -gt 0 ]]; then
            echo "::error::$FAILED dispatch(es) failed"
            exit 1
          fi

      - name: Dry-run summary
        if: steps.cfg.outputs.dry == 'true'
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "_Dry-run: no dispatches sent. Set \`dry_run: false\` to emit._" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sweep artifact
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hypatia-remediation-sweep-${{ github.run_id }}
          path: /tmp/targets.jsonl
          retention-days: 30
          if-no-files-found: ignore
