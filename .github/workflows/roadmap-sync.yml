# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
# Centralized roadmap sweeper: adds recently-touched issues & PRs from every
# public repo owned by REPO_OWNER (except son-shared) into the org-owned
# "Hyperpolymath Master Scheduler" project (PROJECT_OWNER / PROJECT_NUMBER).
#
# WHY centralized (one workflow, one credential) instead of a per-repo workflow:
#   - the credential lives in exactly ONE repo (this one), not ~250 copies;
#   - one file to maintain, one place to rotate.
# CREDENTIAL: a GitHub App owned by the project's org. Every run mints a <=1 h
# installation token (Org: Projects read/write; Repo: Issues read, Metadata read)
# from the App's private key (secret ROADMAP_SYNC_APP_PRIVATE_KEY) and client id
# (variable ROADMAP_SYNC_APP_CLIENT_ID). No PAT; the key is the only long-lived
# material. GITHUB_TOKEN is unused (permissions: {}).
# COVERAGE: public repos only. Private repos become visible by installing the
# same App on REPO_OWNER with Issues: read and minting a second token — a
# deliberate later step.
name: Roadmap Sync

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 min; the window below overlaps it
  workflow_dispatch:
    inputs:
      window_min:
        description: 'look-back window in minutes'
        required: false
        default: '45'

permissions: {}              # GITHUB_TOKEN unused; all work goes through the App token

concurrency:
  group: roadmap-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REPO_OWNER: hyperpolymath          # whose public repos are swept
      PROJECT_OWNER: metadatastician     # who owns the project
      PROJECT_NUMBER: '2'
      # son-shared repos — excluded per estate boundaries (AGPL, son's work)
      EXCLUDE: 'idaptik burble rattlescript vcl-ut'
      WINDOW_MIN: ${{ inputs.window_min || '45' }}   # look-back window (> cron interval for overlap)
    steps:
      - name: Mint App installation token
        id: app
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.ROADMAP_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.ROADMAP_SYNC_APP_PRIVATE_KEY }}
          owner: metadatastician             # the installation's owner, not this repo's
          permission-organization-projects: write
          permission-issues: read
          permission-metadata: read

      - name: Preflight (positive control, then the cross-owner read)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          echo "token sees org: $(gh api "orgs/$PROJECT_OWNER" --jq .login)"
          PID=$(gh api graphql \
            -f query='query($o:String!,$n:Int!){organization(login:$o){projectV2(number:$n){id}}}' \
            -f o="$PROJECT_OWNER" -F n="$PROJECT_NUMBER" --jq '.data.organization.projectV2.id')
          case "$PID" in
            PVT_kwDO*) echo "org project id: $PID" ;;
            *) echo "::error::not an org project id: '$PID' (check PROJECT_NUMBER)"; exit 1 ;;
          esac
          # Probe a repo the sweep itself would read: the first public repo listed.
          if ! probe=$(gh api "users/$REPO_OWNER/repos?type=owner&per_page=1" --jq '.[0].name // empty') \
             || [ -z "$probe" ]; then
            echo "::error::installation token cannot list public $REPO_OWNER repos; switch to the fine-grained PAT fallback"
            exit 1
          fi
          if ! n=$(gh api "repos/$REPO_OWNER/$probe/issues?state=open&per_page=1" --jq length); then
            echo "::error::installation token cannot read issues of public repo $REPO_OWNER/$probe; switch to the fine-grained PAT fallback"
            exit 1
          fi
          echo "cross-owner read ok ($REPO_OWNER/$probe, $n item)"

      - name: Sweep recent issues/PRs into the roadmap
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          SINCE=$(date -u -d "${WINDOW_MIN} minutes ago" +%Y-%m-%dT%H:%M:%SZ)
          echo "::group::Setup"
          echo "Window since: $SINCE"
          PID=$(gh api graphql \
            -f query='query($o:String!,$n:Int!){organization(login:$o){projectV2(number:$n){id title}}}' \
            -f o="$PROJECT_OWNER" -F n="$PROJECT_NUMBER" --jq '.data.organization.projectV2.id')
          echo "Project node id: $PID"
          echo "::endgroup::"

          # Public, non-fork, non-archived repos owned by REPO_OWNER. The App is
          # not installed there, so only public repos are visible (see header).
          # Capture the listing's exit status: a process substitution would hide a
          # failed or partial listing from set -e and let the sweep "succeed".
          if ! REPO_LIST=$(gh api --paginate \
            "users/$REPO_OWNER/repos?type=owner&per_page=100" \
            --jq '.[] | select(.fork==false and .archived==false) | .name'); then
            echo "::error::could not list repositories for $REPO_OWNER"
            exit 1
          fi
          REPOS=()
          if [ -n "$REPO_LIST" ]; then
            mapfile -t REPOS <<< "$REPO_LIST"
          fi
          echo "Visible owned repos: ${#REPOS[@]}"

          scanned=0; items=0; adds=0; unreadable=0
          for r in "${REPOS[@]}"; do
            skip=0
            for x in $EXCLUDE; do [ "$r" = "$x" ] && skip=1 && break; done
            if [ "$skip" = "1" ]; then echo "skip (son-shared): $r"; continue; fi
            scanned=$((scanned+1))

            # The issues endpoint returns BOTH issues and PRs, filtered by
            # updated_at >= since. node_id works for either content type.
            if ! NODES=$(gh api --paginate \
                 "repos/$REPO_OWNER/$r/issues?state=open&since=$SINCE&per_page=100" \
                 --jq '.[].node_id'); then
              unreadable=$((unreadable+1)); echo "::warning::could not list issues of $r"; continue
            fi
            for nid in $NODES; do
              [ -z "$nid" ] && continue
              items=$((items+1))
              # addProjectV2ItemById is idempotent: re-adding an existing item
              # returns the existing item id, so overlapping windows are safe.
              if gh api graphql \
                   -f query='mutation($p:ID!,$c:ID!){addProjectV2ItemById(input:{projectId:$p,contentId:$c}){item{id}}}' \
                   -f p="$PID" -f c="$nid" >/dev/null 2>&1; then
                adds=$((adds+1))
              else
                echo "::warning::could not add node $nid (from $r)"
              fi
            done
          done

          echo "----------------------------------------"
          echo "Repos scanned: $scanned (excluded: $EXCLUDE; unreadable: $unreadable)"
          echo "Recent items seen: $items | add-calls ok: $adds (idempotent)"
          echo "NOTE: private repos are not covered until the App is installed on $REPO_OWNER."
