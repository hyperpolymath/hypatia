#
# The scheduled-trigger (cron) half of the merge-orchestration runtime. Runs one
# `mix hypatia.merge_orchestrate` cycle: read the shared store -> sense ->
# deliberate -> gate -> write the merge-decision manifest, then upload it as an
# artifact. The in-brain GenServer tick (Hypatia.MergeOrchestration.Ticker, off
# by default) is the other half.
#
# The brain stays token-free: this computes + uploads the decision manifest; the
# .git-private-farm actuator (separate, token-bearing) re-verifies and merges.
# Point MERGE_ORCH_STORE at a populated store (e.g. a checked-out verisim-data)
# via a repo variable; the default data/verisim is the in-repo store.
name: Merge Orchestrate (scheduled)

on:
  workflow_dispatch:
  schedule:
  # Hourly, offset off the top of the hour to dodge runner congestion.
  - cron: '17 * * * *'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: read-all

jobs:
  cycle:
    name: One merge-orchestration cycle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MERGE_ORCH_STORE: ${{ vars.MERGE_ORCH_STORE || 'store' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # The brain needs a POPULATED store. Its in-repo data/verisim has no
      # observations/ directory -- the farm's merge-observe.yml writes them to
      # verisimdb-data, the estate's canonical flat-file store. Without this
      # checkout the cycle reads an empty directory and decides nothing, which
      # is what it has been doing every hour since the cron was added.
      # Read-only: the brain stays token-free and never writes here.
      - name: Checkout the observation store (verisimdb-data)
        uses: actions/checkout@v7.0.1
        with:
          repository: hyperpolymath/verisimdb-data
          path: store

      - name: Setup Erlang/Elixir
        uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: '27.0'
          elixir-version: '1.17'

      - name: Restore Mix cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Run one cycle
        # Store comes from the MERGE_ORCH_STORE env (set above); the task reads it.
        run: mix hypatia.merge_orchestrate --store "$MERGE_ORCH_STORE"

      - name: Upload decision manifest
        uses: actions/upload-artifact@v7.0.1
        with:
          name: merge-decisions
          path: ${{ env.MERGE_ORCH_STORE }}/merge-decisions.jsonl
          if-no-files-found: ignore
          retention-days: 7
