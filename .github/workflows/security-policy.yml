# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
# Consolidated workflow (behaviour-preserving merge).
# Merged from: security-audit.yml, security.yml
name: Security

on:
  push:
    branches:
    - develop
    - main
  pull_request:
    branches:
    - develop
    - main
  schedule:
  - cron: '0 2 * * *'
  - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  rust-audit:
    name: Rust Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit --json > rust-audit.json || true

      - name: Check for vulnerabilities
        run: |
          if cargo audit 2>&1 | grep -q "Vulnerability"; then
            echo "::warning::Security vulnerabilities found in Rust dependencies"
            cargo audit
          else
            echo "No known vulnerabilities found"
          fi

      - name: Upload audit results
        uses: actions/upload-artifact@v7.0.1
        with:
          name: rust-audit-results
          path: rust-audit.json
          retention-days: 30

  rust-deny:
    name: Rust License & Ban Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2.87.18
        with:
          tool: cargo-deny

      - name: Check licenses and bans
        run: cargo deny check || true

  # ============================================================================
  # Secret Detection
  # ============================================================================

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # TruffleHog refuses to scan when base == head, exiting non-zero with
      # "BASE and HEAD commits are the same. TruffleHog won't scan anything."
      # The old inputs were `base: <default_branch>` + `head: HEAD`. On a
      # `pull_request` those legitimately differ, so the diff scan worked and
      # the defect was invisible. On `push: main` HEAD *is* the default branch,
      # so the range was EMPTY and the default branch went completely unscanned
      # -- while the job merely looked "red", which reads like an auth problem
      # rather than like zero coverage.
      #
      # This step resolves the range EXPLICITLY for every event, read off the
      # action source at the pinned v3.97.5. That matters, because when both
      # inputs are left empty the action does not fall through to one
      # behaviour -- it dispatches on the event itself:
      #   push                       -> BASE=github.event.before
      #                                 HEAD=github.event.after
      #                                 ...and if github.event.commits is
      #                                 empty it prints "No commits to scan"
      #                                 and `exit 0`: a GREEN job that scanned
      #                                 nothing, the same lie in a different
      #                                 costume.
      #   schedule/workflow_dispatch -> BASE="", HEAD=""
      #   pull_request               -> BASE=base.sha, HEAD=head.sha
      # Passing a non-empty input takes the action's explicit branch instead,
      # so nothing about push is left to that hidden dispatch and the silent
      # `exit 0` is unreachable.
      #
      # The action always ends at `trufflehog git <repo> --since-commit $BASE
      # --branch $HEAD`. Measured against the CLI: empty BASE/HEAD expand to
      # empty-STRING arguments (not absent ones), which TruffleHog accepts as
      # "all history, all branches" -- verified locally on a scratch repo,
      # where that found a private key deleted from the worktree and surviving
      # only in git history.
      #
      # So the coverage this buys, stated exactly:
      #   pull_request -> the PR's own commits
      #   push         -> the commits the push introduced (everything reachable
      #                   when the branch is new, since `before` is all-zeros)
      #   schedule     -> whole git history, 02:00 daily and 03:00 Mondays
      # Whole-history coverage comes from the SCHEDULED run, not from push.
      #
      # Context goes through `env:` rather than into the shell line, per
      # .claude/CLAUDE.md -- a branch name is attacker-controllable text.
      - name: Resolve TruffleHog scan range
        id: th
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -uo pipefail
          zero='0000000000000000000000000000000000000000'
          case "$EVENT" in
            pull_request)
              base="$PR_BASE"
              head="$PR_HEAD"
              if [ -z "$base" ] || [ -z "$head" ] || [ "$base" = "$head" ]; then
                echo "::error::Degenerate TruffleHog range (base='$base' head='$head'). Refusing to let an unscanned tree report as scanned."
                exit 1
              fi
              n=$(git rev-list --count "${base}..${head}" 2>/dev/null || echo 0)
              echo "trufflehog mode: pull_request diff | range: ${base}..${head} | commits: ${n}"
              ;;
            push)
              head="$PUSH_AFTER"
              if [ -z "$head" ] || [ "$head" = "$zero" ]; then
                echo "::error::push event with no head commit (after='${head}'). Nothing to scan is not the same as nothing found."
                exit 1
              fi
              if [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "$zero" ]; then
                base=''
                n=$(git rev-list --count "$head" 2>/dev/null || echo 0)
                echo "trufflehog mode: push, new branch | range: (root)..${head} | commits: ${n}"
              else
                base="$PUSH_BEFORE"
                if [ "$base" = "$head" ]; then
                  echo "::error::push event with before == after (${base}). An empty range is not a clean scan."
                  exit 1
                fi
                n=$(git rev-list --count "${base}..${head}" 2>/dev/null || echo 0)
                echo "trufflehog mode: push diff | range: ${base}..${head} | commits: ${n}"
              fi
              ;;
            *)
              base=''
              head=''
              n=$(git rev-list --count --all 2>/dev/null || echo 0)
              echo "trufflehog mode: whole git history | commits: ${n}"
              ;;
          esac
          if [ "${n:-0}" -eq 0 ]; then
            echo "::error::0 commits in the resolved range. A scanner with an empty subject cannot report clean."
            exit 1
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@v3.97.6
        with:
          path: ./
          base: ${{ steps.th.outputs.base }}
          head: ${{ steps.th.outputs.head }}
          extra_args: --only-verified

      # `.gitleaks.toml` carries `[extend] path = ".gitleaks-estate.toml"`, and
      # gitleaks resolves that against the PROCESS CWD. Only standards'
      # secret-scanner-reusable.yml staged that file, so these two hand-rolled
      # jobs died before scanning a single byte:
      #   FTL failed to load extended config ... no such file or directory
      # the action then crashed on the results.sarif it never wrote, and the
      # audit summary reported a CRASHED SCANNER as "possible secrets in
      # repository" -- a fake red in the worst possible direction for a
      # security gate. Pinned to the same standards sha that
      # .github/workflows/secret-scanner.yml already consumes.
      - name: Fetch estate gitleaks baseline
        uses: actions/checkout@v7.0.1
        with:
          repository: hyperpolymath/standards
          ref: 571cc734cd69fb846032ec77a662aa8ee4fc32cd
          path: .standards-gitleaks
          sparse-checkout: |
            config/gitleaks/estate-baseline.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Stage estate gitleaks baseline
        run: |
          set -euo pipefail
          cp .standards-gitleaks/config/gitleaks/estate-baseline.toml .gitleaks-estate.toml
          # Delete the tooling checkout BEFORE scanning, or the scan walks
          # standards' own tree and reports ITS files as hypatia's.
          rm -rf .standards-gitleaks
          test -s .gitleaks-estate.toml

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['actions']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.0 (4.38.1 blocked estate-wide; nexia-list#100)
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.0 (4.38.1 blocked estate-wide; nexia-list#100)
        with:
          category: "/language:${{matrix.language}}"

  # ============================================================================
  # SBOM Generation
  # ============================================================================

  sbom-rust:
    name: Generate Rust SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked --version 0.5.9

      - name: Generate CycloneDX SBOM
        run: |
          cargo cyclonedx --format json --override-filename rust-sbom.cdx
          cargo cyclonedx --format xml --override-filename rust-sbom.cdx

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: rust-sbom
          path: |
            **/rust-sbom.cdx.json
            **/rust-sbom.cdx.xml
          retention-days: 90

  # ============================================================================
  # Container Security Scanning
  # ============================================================================

  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request'
    # The workflow default is `read-all`, and a job-level map REPLACES that
    # default rather than merging with it -- so a job that uploads SARIF must
    # spell out BOTH scopes. Without this the Trivy scan ran fine and only
    # `upload-sarif` died with "Resource not accessible by integration", which
    # this workflow then displayed as a failed Container Security Scan. That is
    # the same confusion as the TruffleHog one: the scanner looked and found
    # nothing wrong; it was the *filing* of the result that was denied.
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Build test image
        run: |
          docker build -t hypatia:scan -f deploy/Containerfile .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'hypatia:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.0 (4.38.1 blocked estate-wide; nexia-list#100)
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ============================================================================
  # Security Status Summary
  # ============================================================================

  security-status:
    name: Security Status
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - rust-audit
      - rust-deny
      - secret-scan
      - codeql
      - sbom-rust
    if: always()
    steps:
      - name: Check security scan status
        run: |
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          declare -A jobs=(
            ["rust-audit"]="${{ needs.rust-audit.result }}"
            ["rust-deny"]="${{ needs.rust-deny.result }}"
            ["secret-scan"]="${{ needs.secret-scan.result }}"
            ["codeql"]="${{ needs.codeql.result }}"
            ["sbom-rust"]="${{ needs.sbom-rust.result }}"
          )

          # This job is named "Security Status" and, until now, could not
          # report a bad one: it computed `failed=true`, wrote a sentence into
          # the step summary, and then ended the step successfully. Measured on
          # run 35772115983, `Security Status` was GREEN while its own
          # dependency `Secret Detection` was RED. A status check that cannot
          # go red is decoration, and decoration that looks like a gate is
          # worse than no gate -- so it now exits non-zero.
          #
          # None of the five dependencies carries an `if:`, so `skipped` can
          # only mean an upstream failure or a cancelled run, and is counted as
          # a non-success rather than warned about.
          ok=0
          total=0
          failed=0
          for job in "${!jobs[@]}"; do
            result="${jobs[$job]}"
            total=$((total + 1))
            if [[ "$result" == "success" ]]; then
              echo "- :white_check_mark: $job: $result" >> $GITHUB_STEP_SUMMARY
              ok=$((ok + 1))
            else
              # Says only what is known. `failure` means the job did not
              # complete; it does NOT mean the scanner found something.
              echo "- :x: $job: ${result:-<empty>} (did not complete -- no verdict)" >> $GITHUB_STEP_SUMMARY
              failed=$((failed + 1))
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "security scans: ${ok} of ${total} completed successfully" >> $GITHUB_STEP_SUMMARY
          echo "security scans: ${ok} of ${total} completed successfully"

          if [[ "$total" -eq 0 ]]; then
            echo "::error::0 security scans were evaluated. A status with an empty denominator cannot report clean."
            exit 1
          fi

          if [[ "$failed" -gt 0 ]]; then
            echo "::error::${failed} of ${total} security scans did not complete. Missing evidence is not a pass."
            exit 1
          fi

  audit_rust-audit:
    name: Rust Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit (JSON output)
        run: cargo audit --json > rust-audit-report.json || true

      - name: Run cargo audit (human-readable)
        id: audit
        run: |
          if cargo audit 2>&1 | grep -q "Vulnerability"; then
            echo "vulnerabilities_found=true" >> $GITHUB_OUTPUT
            echo "::warning::Security vulnerabilities found in Rust dependencies"
            cargo audit
            exit 0  # Don't fail yet, let the summary job decide
          else
            echo "vulnerabilities_found=false" >> $GITHUB_OUTPUT
            echo "No known vulnerabilities found"
          fi

      - name: Upload audit results
        uses: actions/upload-artifact@v7.0.1
        with:
          name: rust-audit-report
          path: rust-audit-report.json
          retention-days: 30

  audit_rust-deny:
    name: Rust License & Ban Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2.87.18
        with:
          tool: cargo-deny

      - name: Create deny.toml if missing
        run: |
          if [ ! -f deny.toml ]; then
            cat > deny.toml << 'EOF'
          # SPDX-License-Identifier: MPL-2.0
          # cargo-deny configuration for hypatia

          [advisories]
          db-path = "~/.cargo/advisory-db"
          db-urls = ["https://github.com/rustsec/advisory-db"]
          vulnerability = "deny"
          unmaintained = "warn"
          yanked = "warn"
          notice = "warn"

          [licenses]
          unlicensed = "deny"
          allow = [
              "MIT",
              "Apache-2.0",
              "Apache-2.0 WITH LLVM-exception",
              "BSD-2-Clause",
              "BSD-3-Clause",
              "ISC",
              "Zlib",
              "CC0-1.0",
              "MPL-2.0",
              "Unicode-DFS-2016",
          ]
          copyleft = "warn"
          default = "deny"

          [bans]
          multiple-versions = "warn"
          wildcards = "warn"
          highlight = "all"
          skip = []
          skip-tree = []

          [sources]
          unknown-registry = "deny"
          unknown-git = "warn"
          allow-registry = ["https://github.com/rust-lang/crates.io-index"]
          EOF
          fi

      - name: Check licenses and bans
        run: cargo deny check 2>&1 | tee cargo-deny-report.txt || true

      - name: Upload deny results
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cargo-deny-report
          path: cargo-deny-report.txt
          retention-days: 30

  # ============================================================================
  # Haskell Security Audit
  # Container Security Scanning
  # ============================================================================

  audit_container-scan:
    name: Container Security (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same fault, same cure as `container-scan` above: uploading SARIF needs
    # `security-events: write`, and a job-level map replaces the workflow's
    # `read-all` rather than adding to it.
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Only deploy/Containerfile is currently in the tree; the adapter /
        # engine / registry variants are part of an earlier multi-image
        # split that hasn't landed yet. Add them back here when they exist.
        dockerfile:
          - deploy/Containerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Extract image name from Containerfile path
        id: image
        run: |
          dockerfile="${{ matrix.dockerfile }}"
          name=$(basename "$dockerfile" | sed 's/Containerfile/hypatia/' | sed 's/^\.//' | sed 's/^-//')
          if [ "$name" = "hypatia" ]; then
            name="hypatia-main"
          fi
          echo "name=$name" >> $GITHUB_OUTPUT

      - name: Build container image
        run: |
          docker build -t ${{ steps.image.outputs.name }}:scan -f ${{ matrix.dockerfile }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ steps.image.outputs.name }}:scan'
          format: 'sarif'
          output: 'trivy-${{ steps.image.outputs.name }}.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          ignore-unfixed: true

      - name: Run Trivy (table output)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ steps.image.outputs.name }}:scan'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy SARIF results
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.0 (4.38.1 blocked estate-wide; nexia-list#100)
        if: always()
        with:
          sarif_file: 'trivy-${{ steps.image.outputs.name }}.sarif'
          category: 'trivy-${{ steps.image.outputs.name }}'

  # ============================================================================
  # Secret Detection
  # ============================================================================

  gitleaks:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Create gitleaks config if missing
        run: |
          if [ ! -f .gitleaks.toml ]; then
            cat > .gitleaks.toml << 'EOF'
          # SPDX-License-Identifier: MPL-2.0
          # Gitleaks configuration for hypatia

          title = "hypatia gitleaks configuration"

          [allowlist]
          description = "Allowlisted files and patterns"
          paths = [
              '''(^|/)\.gitleaks\.toml$''',
              '''(^|/)docs/.*\.adoc$''',
              '''(^|/)test/.*''',
              '''node_modules''',
              '''target/''',
              '''dist-newstyle/''',
          ]

          [[rules]]
          id = "github-token"
          description = "GitHub Token"
          regex = '''ghp_[0-9a-zA-Z]{36}'''
          tags = ["key", "github"]

          [[rules]]
          id = "gitlab-token"
          description = "GitLab Token"
          regex = '''glpat-[0-9a-zA-Z\-_]{20}'''
          tags = ["key", "gitlab"]

          [[rules]]
          id = "generic-api-key"
          description = "Generic API Key"
          regex = '''(?i)(api[_-]?key|apikey)\s*[=:]\s*['"]?([a-zA-Z0-9_\-]{20,})['"]?'''
          tags = ["key", "api"]

          [[rules]]
          id = "private-key"
          description = "Private Key"
          regex = '''-----BEGIN (RSA|DSA|EC|OPENSSH) PRIVATE KEY-----'''
          tags = ["key", "private"]
          EOF
          fi

      # `.gitleaks.toml` carries `[extend] path = ".gitleaks-estate.toml"`, and
      # gitleaks resolves that against the PROCESS CWD. Only standards'
      # secret-scanner-reusable.yml staged that file, so these two hand-rolled
      # jobs died before scanning a single byte:
      #   FTL failed to load extended config ... no such file or directory
      # the action then crashed on the results.sarif it never wrote, and the
      # audit summary reported a CRASHED SCANNER as "possible secrets in
      # repository" -- a fake red in the worst possible direction for a
      # security gate. Pinned to the same standards sha that
      # .github/workflows/secret-scanner.yml already consumes.
      - name: Fetch estate gitleaks baseline
        uses: actions/checkout@v7.0.1
        with:
          repository: hyperpolymath/standards
          ref: 571cc734cd69fb846032ec77a662aa8ee4fc32cd
          path: .standards-gitleaks
          sparse-checkout: |
            config/gitleaks/estate-baseline.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Stage estate gitleaks baseline
        run: |
          set -euo pipefail
          cp .standards-gitleaks/config/gitleaks/estate-baseline.toml .gitleaks-estate.toml
          # Delete the tooling checkout BEFORE scanning, or the scan walks
          # standards' own tree and reports ITS files as hypatia's.
          rm -rf .standards-gitleaks
          test -s .gitleaks-estate.toml

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  trufflehog:
    name: Secret Detection (TruffleHog)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # TruffleHog refuses to scan when base == head, exiting non-zero with
      # "BASE and HEAD commits are the same. TruffleHog won't scan anything."
      # The old inputs were `base: <default_branch>` + `head: HEAD`. On a
      # `pull_request` those legitimately differ, so the diff scan worked and
      # the defect was invisible. On `push: main` HEAD *is* the default branch,
      # so the range was EMPTY and the default branch went completely unscanned
      # -- while the job merely looked "red", which reads like an auth problem
      # rather than like zero coverage.
      #
      # This step resolves the range EXPLICITLY for every event, read off the
      # action source at the pinned v3.97.5. That matters, because when both
      # inputs are left empty the action does not fall through to one
      # behaviour -- it dispatches on the event itself:
      #   push                       -> BASE=github.event.before
      #                                 HEAD=github.event.after
      #                                 ...and if github.event.commits is
      #                                 empty it prints "No commits to scan"
      #                                 and `exit 0`: a GREEN job that scanned
      #                                 nothing, the same lie in a different
      #                                 costume.
      #   schedule/workflow_dispatch -> BASE="", HEAD=""
      #   pull_request               -> BASE=base.sha, HEAD=head.sha
      # Passing a non-empty input takes the action's explicit branch instead,
      # so nothing about push is left to that hidden dispatch and the silent
      # `exit 0` is unreachable.
      #
      # The action always ends at `trufflehog git <repo> --since-commit $BASE
      # --branch $HEAD`. Measured against the CLI: empty BASE/HEAD expand to
      # empty-STRING arguments (not absent ones), which TruffleHog accepts as
      # "all history, all branches" -- verified locally on a scratch repo,
      # where that found a private key deleted from the worktree and surviving
      # only in git history.
      #
      # So the coverage this buys, stated exactly:
      #   pull_request -> the PR's own commits
      #   push         -> the commits the push introduced (everything reachable
      #                   when the branch is new, since `before` is all-zeros)
      #   schedule     -> whole git history, 02:00 daily and 03:00 Mondays
      # Whole-history coverage comes from the SCHEDULED run, not from push.
      #
      # Context goes through `env:` rather than into the shell line, per
      # .claude/CLAUDE.md -- a branch name is attacker-controllable text.
      - name: Resolve TruffleHog scan range
        id: th
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -uo pipefail
          zero='0000000000000000000000000000000000000000'
          case "$EVENT" in
            pull_request)
              base="$PR_BASE"
              head="$PR_HEAD"
              if [ -z "$base" ] || [ -z "$head" ] || [ "$base" = "$head" ]; then
                echo "::error::Degenerate TruffleHog range (base='$base' head='$head'). Refusing to let an unscanned tree report as scanned."
                exit 1
              fi
              n=$(git rev-list --count "${base}..${head}" 2>/dev/null || echo 0)
              echo "trufflehog mode: pull_request diff | range: ${base}..${head} | commits: ${n}"
              ;;
            push)
              head="$PUSH_AFTER"
              if [ -z "$head" ] || [ "$head" = "$zero" ]; then
                echo "::error::push event with no head commit (after='${head}'). Nothing to scan is not the same as nothing found."
                exit 1
              fi
              if [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "$zero" ]; then
                base=''
                n=$(git rev-list --count "$head" 2>/dev/null || echo 0)
                echo "trufflehog mode: push, new branch | range: (root)..${head} | commits: ${n}"
              else
                base="$PUSH_BEFORE"
                if [ "$base" = "$head" ]; then
                  echo "::error::push event with before == after (${base}). An empty range is not a clean scan."
                  exit 1
                fi
                n=$(git rev-list --count "${base}..${head}" 2>/dev/null || echo 0)
                echo "trufflehog mode: push diff | range: ${base}..${head} | commits: ${n}"
              fi
              ;;
            *)
              base=''
              head=''
              n=$(git rev-list --count --all 2>/dev/null || echo 0)
              echo "trufflehog mode: whole git history | commits: ${n}"
              ;;
          esac
          if [ "${n:-0}" -eq 0 ]; then
            echo "::error::0 commits in the resolved range. A scanner with an empty subject cannot report clean."
            exit 1
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@v3.97.6
        with:
          path: ./
          base: ${{ steps.th.outputs.base }}
          head: ${{ steps.th.outputs.head }}
          extra_args: --only-verified

  # ============================================================================
  # SAST (Static Application Security Testing)
  # ============================================================================

  audit_codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['actions']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.0 (4.38.1 blocked estate-wide; nexia-list#100)
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.0 (4.38.1 blocked estate-wide; nexia-list#100)
        with:
          category: "/language:${{matrix.language}}"

  # ============================================================================
  # License Compliance
  # ============================================================================

  license-check:
    name: License Compliance Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Check SPDX headers in source files
        run: |
          echo "## SPDX License Header Check" > license-report.md
          echo "" >> license-report.md

          missing_headers=0

          # Check Rust files
          echo "### Rust Files" >> license-report.md
          for f in $(find . -name "*.rs" -not -path "./target/*" -not -path "./security-fixes/*" 2>/dev/null); do
            if ! head -5 "$f" | grep -q "SPDX-License-Identifier"; then
              echo "- Missing: $f" >> license-report.md
              missing_headers=$((missing_headers + 1))
            fi
          done

          # Check Haskell files
          echo "" >> license-report.md
          echo "### Haskell Files" >> license-report.md
          for f in $(find . -name "*.hs" -not -path "./dist-newstyle/*" 2>/dev/null); do
            if ! head -5 "$f" | grep -q "SPDX-License-Identifier"; then
              echo "- Missing: $f" >> license-report.md
              missing_headers=$((missing_headers + 1))
            fi
          done

          # Check Shell scripts
          echo "" >> license-report.md
          echo "### Shell Scripts" >> license-report.md
          for f in $(find . -name "*.sh" -not -path "./target/*" -not -path "./security-fixes/*" 2>/dev/null); do
            if ! head -5 "$f" | grep -q "SPDX-License-Identifier"; then
              echo "- Missing: $f" >> license-report.md
              missing_headers=$((missing_headers + 1))
            fi
          done

          # Check YAML workflows
          echo "" >> license-report.md
          echo "### GitHub Workflows" >> license-report.md
          for f in $(find .github/workflows -name "*.yml" 2>/dev/null); do
            if ! head -1 "$f" | grep -q "SPDX-License-Identifier"; then
              echo "- Missing: $f" >> license-report.md
              missing_headers=$((missing_headers + 1))
            fi
          done

          echo "" >> license-report.md
          echo "**Total files missing SPDX header: $missing_headers**" >> license-report.md

          cat license-report.md

          if [ $missing_headers -gt 0 ]; then
            echo "::warning::$missing_headers files are missing SPDX license headers"
          fi

      - name: Upload license report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: license-compliance-report
          path: license-report.md
          retention-days: 30

  # ============================================================================
  # SBOM Generation
  # ============================================================================

  sbom-generation:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked --version 0.5.9

      - name: Generate Rust SBOM
        run: |
          cargo cyclonedx --format json --override-filename sbom-rust.cdx || true
          cargo cyclonedx --format xml --override-filename sbom-rust.cdx || true


      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sbom
          path: |
            **/sbom-rust.cdx.json
            **/sbom-rust.cdx.xml
          retention-days: 90

  # ============================================================================
  # Security Audit Summary
  # ============================================================================

  audit-summary:
    name: Security Audit Summary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - audit_rust-audit
      - audit_rust-deny
      - audit_container-scan
      - gitleaks
      - trufflehog
      - audit_codeql
      - license-check
      - sbom-generation
    if: always()
    steps:
      - name: Generate audit summary
        run: |
          echo "## Security Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY

          # Function to map status
          status_icon() {
            case "$1" in
              success) echo ":white_check_mark:" ;;
              failure) echo ":x:" ;;
              cancelled) echo ":grey_question:" ;;
              skipped) echo ":fast_forward:" ;;
              *) echo ":warning:" ;;
            esac
          }

          echo "| Rust Audit | $(status_icon '${{ needs.audit_rust-audit.result }}') ${{ needs.audit_rust-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Rust Deny | $(status_icon '${{ needs.audit_rust-deny.result }}') ${{ needs.audit_rust-deny.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container Scan | $(status_icon '${{ needs.audit_container-scan.result }}') ${{ needs.audit_container-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Gitleaks | $(status_icon '${{ needs.gitleaks.result }}') ${{ needs.gitleaks.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| TruffleHog | $(status_icon '${{ needs.trufflehog.result }}') ${{ needs.trufflehog.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL | $(status_icon '${{ needs.audit_codeql.result }}') ${{ needs.audit_codeql.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| License Check | $(status_icon '${{ needs.license-check.result }}') ${{ needs.license-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SBOM Generation | $(status_icon '${{ needs.sbom-generation.result }}') ${{ needs.sbom-generation.result }} |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "_Audit completed at $(date -u +%Y-%m-%dT%H:%M:%SZ)_" >> $GITHUB_STEP_SUMMARY

      # Two faults lived in this step, both of which made a broken security
      # gate read as a working one:
      #
      # 1. It inspected 3 of its 8 `needs:`. The table above DISPLAYS all eight;
      #    displaying a dependency is not gating on it. A failing container scan
      #    was rendered as :x: and then silently ignored by the decision.
      # 2. `failure` means "this job did not complete". It NEVER means "this job
      #    found something" -- a scanner that crashed, timed out, or was refused
      #    a credential reports the identical result to one that found a secret.
      #    The old text asserted "TruffleHog found verified secrets" whenever the
      #    job was red, which manufactured a detection claim out of a scanner
      #    that had scanned zero bytes. Fake alarms train people to ignore the
      #    check; the same confusion lets a genuinely broken scanner read clean.
      #
      # All eight dependencies are unconditional (none carries an `if:`), so
      # `skipped` here can only mean an upstream failure or a cancelled run.
      # It is therefore failed on, not warned about: `::warning::` cannot fail a
      # job, so warning while calling a skip "not a pass" asserts the opposite.
      - name: Check for failures
        run: |
          set -uo pipefail
          ok=0
          total=0
          failed=0

          # Says only what is known: the job did not complete, so the evidence
          # that check was supposed to produce is missing. Never a detection.
          check() {
            total=$((total + 1))
            case "$2" in
              success)
                ok=$((ok + 1))
                ;;
              *)
                echo "::error::$1 did not complete successfully (result=${2:-<empty>}) -- no verdict was produced, so its evidence is MISSING. This is not a detection."
                failed=$((failed + 1))
                ;;
            esac
          }

          check "Rust audit"      "${{ needs.audit_rust-audit.result }}"
          check "Rust deny"       "${{ needs.audit_rust-deny.result }}"
          check "Container scan"  "${{ needs.audit_container-scan.result }}"
          check "Gitleaks"        "${{ needs.gitleaks.result }}"
          check "TruffleHog"      "${{ needs.trufflehog.result }}"
          check "CodeQL"          "${{ needs.audit_codeql.result }}"
          check "License check"   "${{ needs.license-check.result }}"
          check "SBOM generation" "${{ needs.sbom-generation.result }}"

          # The denominator is the point: "0 of 0 succeeded" must never be green.
          echo "security checks: ${ok} of ${total} succeeded"

          if [ "$total" -eq 0 ]; then
            echo "::error::0 security checks were evaluated. A rollup with an empty denominator cannot report clean."
            exit 1
          fi

          if [ "$failed" -gt 0 ]; then
            echo "::error::${failed} of ${total} security checks did not complete. Missing evidence is not a pass."
            exit 1
          fi
