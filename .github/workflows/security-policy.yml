# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
# Consolidated workflow. Merged from: security-audit.yml, security.yml
name: Security

on:
  push:
    branches:
    - develop
    - main
  pull_request:
    branches:
    - develop
    - main
  schedule:
  - cron: '0 2 * * *'
  - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

# ============================================================================
# DECISION RECORD — one scan tier, one aggregator (#847, #848, #849, #850, #851)
#
# This workflow used to run TWO near-duplicate tiers of the same scans
# (`rust-audit` vs `audit_rust-audit`, ...), fed by a behaviour-preserving
# merge of security-audit.yml and security.yml. Two aggregators then consulted
# different subsets, `container-scan` was consulted by nobody, and "did the
# security scan pass?" had two answers. Measured before consolidation: 14 jobs,
# 2 aggregators, 6 duplicated scan pairs.
#
# #847 AC1 — which tier survives, with the display names kept. The Tier-B
# bodies survive (they carry the caching, the estate gitleaks baseline
# staging, the Trivy matrix and the hardened aggregator), with the Tier-A
# fixes folded in. Jobs and display names after consolidation:
#
#   rust-audit         "Rust Dependency Audit"        (findings fail the job, #849)
#   rust-deny          "Rust License & Ban Check"     (findings fail the job, #849)
#   secret-gitleaks    "Secret Detection (Gitleaks)"
#   secret-trufflehog  "Secret Detection (TruffleHog)" (two-class policy, #848;
#                                                      scanner pinned, #851)
#   codeql             "CodeQL Analysis"
#   container-scan     "Container Security (Trivy)"   (wired into the rollup, #850)
#   license-check      "License Compliance Check"
#   sbom               "Generate SBOM"
#   security-status    "Security Status"              (the single aggregator)
#
# Display names RETIRED by this consolidation: "Secret Detection",
# "CodeQL SAST", "Generate Rust SBOM", "Container Security Scan",
# "Security Audit Summary".
#
# #847 AC2/AC3 — merge order and required contexts. Measured 2026-09-26:
# the only ACTIVE ruleset requiring status checks on the default branch is
# "ABI-Codegen-Drift" (`abi-codegen-drift`, `zig build test (FFI + wire
# contract)`); neither points at a security display name. The ruleset that
# once required "CodeQL Analysis (actions)" and "CodeQL SAST (actions)"
# (Optimus-Branch) is enforcement=disabled and no open PR predates the
# rename. If Optimus-Branch is ever re-enabled, its required contexts must
# be reconciled with the names above first.
#
# #850 AC4 — the aggregator self-checks that every non-aggregator job in
# this file is named in its `needs:`, so a future orphan job is caught
# mechanically rather than by reading.
# ============================================================================

jobs:
  # ==========================================================================
  # Rust dependency & licence posture
  # ==========================================================================

  rust-audit:
    name: Rust Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # #849: this job used to end with `exit 0  # Don't fail yet, let the
      # summary job decide`. The deferral never happened -- the summary reads
      # job *results*, not step outputs, so the scan was green whatever it
      # found. The job now fails on its own findings, which is the path the
      # old comment promised. No `|| true`, no unconditional `exit 0`.
      - name: Run cargo audit
        run: |
          set -uo pipefail
          set +e
          cargo audit --json > rust-audit-report.json
          rc=$?
          set -e
          if [ ! -s rust-audit-report.json ] || ! jq -e '.vulnerabilities' rust-audit-report.json >/dev/null 2>&1; then
            echo "::error::cargo audit produced no parsable report (exit ${rc}). A crashed scanner is not a clean scan."
            exit 1
          fi
          vulns=$(jq -r '.vulnerabilities.count // 0' rust-audit-report.json)
          warn_classes=$(jq -r '.warnings | keys | length // 0' rust-audit-report.json)
          echo "cargo-audit advisory database scan: vulnerabilities=${vulns} warning-classes=${warn_classes} (report: rust-audit-report.json)"
          echo "advisories found: ${vulns} | warning classes: ${warn_classes}"
          if [ "${vulns}" -gt 0 ]; then
            echo "::error::cargo audit found ${vulns} vulnerable advisories in the dependency tree. This job fails on its own findings (#849)."
            cargo audit
            exit 1
          fi

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: rust-audit-report
          path: rust-audit-report.json
          retention-days: 30

  rust-deny:
    name: Rust License & Ban Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2.87.22
        with:
          tool: cargo-deny

      - name: Create deny.toml if missing
        run: |
          if [ ! -f deny.toml ]; then
            cat > deny.toml << 'EOF'
          # SPDX-License-Identifier: MPL-2.0
          # cargo-deny configuration for hypatia

          [advisories]
          db-path = "~/.cargo/advisory-db"
          db-urls = ["https://github.com/rustsec/advisory-db"]
          vulnerability = "deny"
          unmaintained = "warn"
          yanked = "warn"
          notice = "warn"

          [licenses]
          unlicensed = "deny"
          allow = [
              "MIT",
              "Apache-2.0",
              "Apache-2.0 WITH LLVM-exception",
              "BSD-2-Clause",
              "BSD-3-Clause",
              "ISC",
              "Zlib",
              "CC0-1.0",
              "MPL-2.0",
              "Unicode-DFS-2016",
          ]
          copyleft = "warn"
          default = "deny"

          [bans]
          multiple-versions = "warn"
          wildcards = "warn"
          highlight = "all"
          skip = []
          skip-tree = []

          [sources]
          unknown-registry = "deny"
          unknown-git = "warn"
          allow-registry = ["https://github.com/rust-lang/crates.io-index"]
          EOF
          fi

      # #849: the old step ran `cargo deny check ... || true`, discarding the
      # verdict at the source. pipefail + no suppression: a denied licence or
      # advisory fails this job on its own findings. The report is uploaded
      # either way so the evidence survives a red run.
      - name: Check licenses and bans
        run: |
          set -euo pipefail
          cargo deny check 2>&1 | tee cargo-deny-report.txt
          echo "cargo-deny checked: advisories, bans, licenses, sources (report: cargo-deny-report.txt)"

      - name: Upload deny results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cargo-deny-report
          path: cargo-deny-report.txt
          retention-days: 30

  # ==========================================================================
  # Secret detection
  # ==========================================================================

  secret-gitleaks:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Create gitleaks config if missing
        run: |
          if [ ! -f .gitleaks.toml ]; then
            cat > .gitleaks.toml << 'EOF'
          # SPDX-License-Identifier: MPL-2.0
          # Gitleaks configuration for hypatia

          title = "hypatia gitleaks configuration"

          [allowlist]
          description = "Allowlisted files and patterns"
          paths = [
              '''(^|/)\.gitleaks\.toml$''',
              '''(^|/)docs/.*\.adoc$''',
              '''(^|/)test/.*''',
              '''node_modules''',
              '''target/''',
              '''dist-newstyle/''',
          ]

          [[rules]]
          id = "github-token"
          description = "GitHub Token"
          regex = '''ghp_[0-9a-zA-Z]{36}'''
          tags = ["key", "github"]

          [[rules]]
          id = "gitlab-token"
          description = "GitLab Token"
          regex = '''glpat-[0-9a-zA-Z\-_]{20}'''
          tags = ["key", "gitlab"]

          [[rules]]
          id = "generic-api-key"
          description = "Generic API Key"
          regex = '''(?i)(api[_-]?key|apikey)\s*[=:]\s*['"]?([a-zA-Z0-9_\-]{20,})['"]?'''
          tags = ["key", "api"]

          [[rules]]
          id = "private-key"
          description = "Private Key"
          regex = '''-----BEGIN (RSA|DSA|EC|OPENSSH) PRIVATE KEY-----'''
          tags = ["key", "private"]
          EOF
          fi

      # `.gitleaks.toml` carries `[extend] path = ".gitleaks-estate.toml"`, and
      # gitleaks resolves that against the PROCESS CWD. Only standards'
      # secret-scanner-reusable.yml staged that file, so the hand-rolled job
      # died before scanning a single byte:
      #   FTL failed to load extended config ... no such file or directory
      # the action then crashed on the results.sarif it never wrote, and the
      # summary reported a CRASHED SCANNER as "possible secrets in repository"
      # -- a fake red in the worst possible direction for a security gate.
      # Pinned to the same standards sha that .github/workflows/secret-scanner.yml
      # already consumes.
      - name: Fetch estate gitleaks baseline
        uses: actions/checkout@v7.0.1
        with:
          repository: hyperpolymath/standards
          ref: 571cc734cd69fb846032ec77a662aa8ee4fc32cd
          path: .standards-gitleaks
          sparse-checkout: |
            config/gitleaks/estate-baseline.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Stage estate gitleaks baseline
        run: |
          set -euo pipefail
          cp .standards-gitleaks/config/gitleaks/estate-baseline.toml .gitleaks-estate.toml
          # Delete the tooling checkout BEFORE scanning, or the scan walks
          # standards' own tree and reports ITS files as hypatia's.
          rm -rf .standards-gitleaks
          test -s .gitleaks-estate.toml

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  secret-trufflehog:
    name: Secret Detection (TruffleHog)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Two separate pins live in this job and they bump TOGETHER:
      #   1. `uses: trufflesecurity/trufflehog@v3.97.6`  -- the action wrapper
      #   2. `TRUFFLEHOG_VERSION` / `version:` input below -- the SCANNER
      #      (the container image the wrapper runs)
      # The wrapper's final command is `docker run ... "${IMAGE}:${VERSION}"`,
      # and its `version` input defaults to `latest`, so pinning only the
      # action (what we did before, #851) left the detector itself floating:
      # measured on PR #846, the action pin said v3.97.5 while the log said
      # "trufflehog_version": "3.97.6". Detector behaviour IS this gate's
      # verdict; it must be reproducible.
      # NOTE: a digest reference (`image@sha256:...`) is NOT expressible
      # through this action -- it unconditionally appends ":${VERSION}" to
      # whatever `image:` holds. The explicit tag below is therefore the
      # strongest scanner pin the wrapper supports; the version step proves
      # on every run what actually executed.
      TRUFFLEHOG_VERSION: '3.97.6'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # TruffleHog refuses to scan when base == head, exiting non-zero with
      # "BASE and HEAD commits are the same. TruffleHog won't scan anything."
      # The old inputs were `base: <default_branch>` + `head: HEAD`. On a
      # `pull_request` those legitimately differ, so the diff scan worked and
      # the defect was invisible. On `push: main` HEAD *is* the default branch,
      # so the range was EMPTY and the default branch went completely unscanned
      # -- while the job merely looked "red", which reads like an auth problem
      # rather than like zero coverage.
      #
      # This step resolves the range EXPLICITLY for every event, read off the
      # action source at the pinned v3.97.6. That matters, because when both
      # inputs are left empty the action does not fall through to one
      # behaviour -- it dispatches on the event itself:
      #   push                       -> BASE=github.event.before
      #                                 HEAD=github.event.after
      #                                 ...and if github.event.commits is
      #                                 empty it prints "No commits to scan"
      #                                 and `exit 0`: a GREEN job that scanned
      #                                 nothing, the same lie in a different
      #                                 costume.
      #   schedule/workflow_dispatch -> BASE="", HEAD=""
      #   pull_request               -> BASE=base.sha, HEAD=head.sha
      # Passing a non-empty input takes the action's explicit branch instead,
      # so nothing about push is left to that hidden dispatch and the silent
      # `exit 0` is unreachable.
      #
      # The action always ends at `trufflehog git <repo> --since-commit $BASE
      # --branch $HEAD`. Measured against the CLI: empty BASE/HEAD expand to
      # empty-STRING arguments (not absent ones), which TruffleHog accepts as
      # "all history, all branches" -- verified locally on a scratch repo,
      # where that found a private key deleted from the worktree and surviving
      # only in git history.
      #
      # So the coverage this buys, stated exactly:
      #   pull_request -> the PR's own commits
      #   push         -> the commits the push introduced (everything reachable
      #                   when the branch is new, since `before` is all-zeros)
      #   schedule     -> whole git history, 02:00 daily and 03:00 Mondays
      # Whole-history coverage comes from the SCHEDULED run, not from push.
      #
      # Context goes through `env:` rather than into the shell line, per
      # .claude/CLAUDE.md -- a branch name is attacker-controllable text.
      - name: Resolve TruffleHog scan range
        id: th
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -uo pipefail
          zero='0000000000000000000000000000000000000000'
          case "$EVENT" in
            pull_request)
              base="$PR_BASE"
              head="$PR_HEAD"
              if [ -z "$base" ] || [ -z "$head" ] || [ "$base" = "$head" ]; then
                echo "::error::Degenerate TruffleHog range (base='$base' head='$head'). Refusing to let an unscanned tree report as scanned."
                exit 1
              fi
              n=$(git rev-list --count "${base}..${head}" 2>/dev/null || echo 0)
              echo "trufflehog mode: pull_request diff | range: ${base}..${head} | commits: ${n}"
              ;;
            push)
              head="$PUSH_AFTER"
              if [ -z "$head" ] || [ "$head" = "$zero" ]; then
                echo "::error::push event with no head commit (after='${head}'). Nothing to scan is not the same as nothing found."
                exit 1
              fi
              if [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "$zero" ]; then
                base=''
                n=$(git rev-list --count "$head" 2>/dev/null || echo 0)
                echo "trufflehog mode: push, new branch | range: (root)..${head} | commits: ${n}"
              else
                base="$PUSH_BEFORE"
                if [ "$base" = "$head" ]; then
                  echo "::error::push event with before == after (${base}). An empty range is not a clean scan."
                  exit 1
                fi
                n=$(git rev-list --count "${base}..${head}" 2>/dev/null || echo 0)
                echo "trufflehog mode: push diff | range: ${base}..${head} | commits: ${n}"
              fi
              ;;
            *)
              base=''
              head=''
              n=$(git rev-list --count --all 2>/dev/null || echo 0)
              echo "trufflehog mode: whole git history | commits: ${n}"
              ;;
          esac
          if [ "${n:-0}" -eq 0 ]; then
            echo "::error::0 commits in the resolved range. A scanner with an empty subject cannot report clean."
            exit 1
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      # #851 AC3: the run must show which scanner actually executed, so drift
      # between the pins is visible in the run and not only in this file.
      - name: Report scanner version actually run
        run: |
          set -euo pipefail
          docker pull "ghcr.io/trufflesecurity/trufflehog:${TRUFFLEHOG_VERSION}"
          docker run --rm "ghcr.io/trufflesecurity/trufflehog:${TRUFFLEHOG_VERSION}" --version

      # ======================================================================
      # SECRET-GATE POLICY (#848) -- stated, not implied by a filter flag.
      #
      # A leak must be able to redden this gate. `--only-verified` alone
      # cannot do that: it reports only credentials TruffleHog can verify
      # against a live service, and a leaked PRIVATE KEY -- the single
      # highest-severity thing a secret scanner exists to find -- cannot be
      # verified against any endpoint. Measured: a real 2048-bit RSA key
      # deleted from the worktree but present in history gave
      # `verified_secrets: 0, unverified_secrets: 3`, and the old gate was
      # GREEN. Two passes resolve the tension #848 names (drop the filter
      # outright and false positives flood a gate people then ignore):
      #
      #   Gate A (verified class)   -- findings of ANY detector type whose
      #     credentials TruffleHog could VERIFY against the live service
      #     fail the build. (--results=verified, the supported spelling of
      #     the hidden --only-verified alias.)
      #
      #   Gate B (non-verifiable high-severity class) -- findings of the
      #     PrivateKey detector fail the build REGARDLESS of verification
      #     status, because key material cannot be verified against an
      #     endpoint and "unverified" here means "cannot be checked", not
      #     "probably fine".
      #
      #   Everything else unverified -- reported in the denominator below,
      #     NOT gating. This is the deliberate middle course: the gate is
      #     quiet on speculative generic-credential noise but cannot be
      #     green while private-key material sits in history.
      #
      # Accepted-noise exclusions: NONE. Every future exclusion must be
      # written here as an explicit `--exclude-detectors=<name> -- <reason>`
      # line; an exclusion that lives only in someone's head is not a policy.
      # ======================================================================

      - name: Gate A — verified credentials fail the gate
        uses: trufflesecurity/trufflehog@v3.97.9
        with:
          path: ./
          base: ${{ steps.th.outputs.base }}
          head: ${{ steps.th.outputs.head }}
          version: ${{ env.TRUFFLEHOG_VERSION }}
          extra_args: --results=verified

      - name: Gate B — private keys fail the gate even when unverified
        uses: trufflesecurity/trufflehog@v3.97.9
        with:
          path: ./
          base: ${{ steps.th.outputs.base }}
          head: ${{ steps.th.outputs.head }}
          version: ${{ env.TRUFFLEHOG_VERSION }}
          extra_args: --include-detectors=PrivateKey --results=verified,unverified,unknown

      # #848 AC4: a zero-finding run must be distinguishable from a run that
      # looked at nothing. The range step prints the scan subject (commits);
      # this step prints what the scan returned, by verification status. It
      # is informational (exit 0 by design): the two gates above own the
      # verdicts, and this pass exists so a red or green run can be read.
      # Cost note: one extra scan of the same range. The gates cannot be
      # merged into one action pass without over-failing (one pass cannot
      # say "verified anything OR unverified private keys" without also
      # failing on every unverified generic hit), and the wrapper cannot
      # emit a countable machine-readable output without a dedicated pass.
      - name: Findings denominator (informational)
        env:
          TH_BASE: ${{ steps.th.outputs.base }}
          TH_HEAD: ${{ steps.th.outputs.head }}
        run: |
          set -uo pipefail
          args=(git file:///tmp/ --no-update --json --results=verified,unverified,unknown,filtered_unverified)
          if [ -n "$TH_BASE" ]; then args+=(--since-commit "$TH_BASE"); fi
          if [ -n "$TH_HEAD" ]; then args+=(--branch "$TH_HEAD"); fi
          docker run --rm -v .:/tmp -w /tmp "ghcr.io/trufflesecurity/trufflehog:${TRUFFLEHOG_VERSION}" "${args[@]}" > th-findings.json
          if [ ! -s th-findings.json ]; then
            echo "trufflehog findings: 0 (scanner ran over the resolved range and returned nothing)"
          else
            v=$(grep -c '"Verified": *true' th-findings.json || true)
            u=$(grep -c '"Verified": *false' th-findings.json || true)
            pk=$(grep -c '"DetectorName": *"PrivateKey"' th-findings.json || true)
            echo "trufflehog findings: verified=${v} unverified_or_unknown=${u} (of which PrivateKey: ${pk})"
          fi
          echo "scanner: ghcr.io/trufflesecurity/trufflehog:${TRUFFLEHOG_VERSION} | range commits: $(git rev-list --count --all 2>/dev/null || echo '?')"

  # ==========================================================================
  # SAST
  # ==========================================================================

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['actions']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.0 (4.38.1 blocked estate-wide; nexia-list#100)
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.0 (4.38.1 blocked estate-wide; nexia-list#100)
        with:
          category: "/language:${{matrix.language}}"

  # ==========================================================================
  # Container security
  # ==========================================================================

  # #850: this job used to exist twice -- `container-scan` (consulted by NO
  # aggregator: its failure reached nothing) and `audit_container-scan`.
  # One job now, named in the single aggregator's `needs:`, with the
  # self-check below making a future orphan mechanical.
  container-scan:
    name: Container Security (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The workflow default is `read-all`, and a job-level map REPLACES that
    # default rather than merging with it -- so a job that uploads SARIF must
    # spell out BOTH scopes. Without this the Trivy scan ran fine and only
    # `upload-sarif` died with "Resource not accessible by integration",
    # which this workflow then displayed as a failed container scan. That is
    # the same confusion as the TruffleHog one: the scanner looked and found
    # nothing wrong; it was the *filing* of the result that was denied.
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Only deploy/Containerfile is currently in the tree; the adapter /
        # engine / registry variants are part of an earlier multi-image
        # split that hasn't landed yet. Add them back here when they exist.
        dockerfile:
          - deploy/Containerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Extract image name from Containerfile path
        id: image
        run: |
          dockerfile="${{ matrix.dockerfile }}"
          name=$(basename "$dockerfile" | sed 's/Containerfile/hypatia/' | sed 's/^\.//' | sed 's/^-//')
          if [ "$name" = "hypatia" ]; then
            name="hypatia-main"
          fi
          echo "name=$name" >> $GITHUB_OUTPUT

      - name: Build container image
        run: |
          docker build -t ${{ steps.image.outputs.name }}:scan -f ${{ matrix.dockerfile }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ steps.image.outputs.name }}:scan'
          format: 'sarif'
          output: 'trivy-${{ steps.image.outputs.name }}.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          ignore-unfixed: true

      - name: Run Trivy (table output)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ steps.image.outputs.name }}:scan'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy SARIF results
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.0 (4.38.1 blocked estate-wide; nexia-list#100)
        if: always()
        with:
          sarif_file: 'trivy-${{ steps.image.outputs.name }}.sarif'
          category: 'trivy-${{ steps.image.outputs.name }}'

  # ==========================================================================
  # Licence compliance
  # ==========================================================================

  license-check:
    name: License Compliance Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Check SPDX headers in source files
        run: |
          echo "## SPDX License Header Check" > license-report.md
          echo "" >> license-report.md

          missing_headers=0

          # Check Rust files
          echo "### Rust Files" >> license-report.md
          for f in $(find . -name "*.rs" -not -path "./target/*" -not -path "./security-fixes/*" 2>/dev/null); do
            if ! head -5 "$f" | grep -q "SPDX-License-Identifier"; then
              echo "- Missing: $f" >> license-report.md
              missing_headers=$((missing_headers + 1))
            fi
          done

          # Check Haskell files
          echo "" >> license-report.md
          echo "### Haskell Files" >> license-report.md
          for f in $(find . -name "*.hs" -not -path "./dist-newstyle/*" 2>/dev/null); do
            if ! head -5 "$f" | grep -q "SPDX-License-Identifier"; then
              echo "- Missing: $f" >> license-report.md
              missing_headers=$((missing_headers + 1))
            fi
          done

          # Check Shell scripts
          echo "" >> license-report.md
          echo "### Shell Scripts" >> license-report.md
          for f in $(find . -name "*.sh" -not -path "./target/*" -not -path "./security-fixes/*" 2>/dev/null); do
            if ! head -5 "$f" | grep -q "SPDX-License-Identifier"; then
              echo "- Missing: $f" >> license-report.md
              missing_headers=$((missing_headers + 1))
            fi
          done

          # Check YAML workflows
          echo "" >> license-report.md
          echo "### GitHub Workflows" >> license-report.md
          for f in $(find .github/workflows -name "*.yml" 2>/dev/null); do
            if ! head -1 "$f" | grep -q "SPDX-License-Identifier"; then
              echo "- Missing: $f" >> license-report.md
              missing_headers=$((missing_headers + 1))
            fi
          done

          echo "" >> license-report.md
          echo "**Total files missing SPDX header: $missing_headers**" >> license-report.md

          cat license-report.md
          echo "spdx headers checked; missing: ${missing_headers} (report: license-report.md)"

          if [ $missing_headers -gt 0 ]; then
            echo "::warning::$missing_headers files are missing SPDX license headers"
          fi

      - name: Upload license report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: license-compliance-report
          path: license-report.md
          retention-days: 30

  # ==========================================================================
  # SBOM generation
  # ==========================================================================

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked --version 0.5.9

      - name: Generate CycloneDX SBOM
        run: |
          set -euo pipefail
          cargo cyclonedx --format json --override-filename rust-sbom.cdx
          cargo cyclonedx --format xml --override-filename rust-sbom.cdx
          echo "sbom generated (cyclonedx), files:"
          find . -name 'rust-sbom.cdx.*' -print

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sbom
          path: |
            **/rust-sbom.cdx.json
            **/rust-sbom.cdx.xml
          retention-days: 90

  # ==========================================================================
  # The single aggregator
  # ==========================================================================

  security-status:
    name: Security Status
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # #847 AC4: one aggregator consults EVERY security job. The list below is
    # every job in this workflow except this one; the self-check step asserts
    # that mechanically, so the two cannot drift apart silently (#850 AC4).
    needs:
      - rust-audit
      - rust-deny
      - secret-gitleaks
      - secret-trufflehog
      - codeql
      - container-scan
      - license-check
      - sbom
    if: always()
    steps:
      # #850 AC4: every job in this workflow except the aggregators must be
      # named in some aggregator's `needs:`. Parse the job keys out of this
      # very file and compare; a future orphan job fails HERE rather than
      # being discovered as an unmonitored gate.
      - name: "Self-check — no orphan jobs (every job is in this needs list)"
        run: |
          set -euo pipefail
          wf=.github/workflows/security-policy.yml
          # Top-level job keys: two-space indent under `jobs:`, nothing deeper.
          mapfile -t all_jobs < <(awk '/^jobs:/{f=1;next} f && /^[^ #]/{exit} f && /^  [A-Za-z0-9_-]+:$/ {sub(/^[[:space:]]+/,""); sub(/:$/,""); print}' "$wf")
          needs_list=$(sed -n '/^    needs:$/,/^    if:/p' "$wf" | sed -n 's/^      - //p')
          failed=0
          echo "jobs in workflow: ${#all_jobs[@]}"
          echo "aggregator needs:"
          echo "$needs_list" | sed 's/^/  - /'
          for j in "${all_jobs[@]}"; do
            [ "$j" = "security-status" ] && continue
            if ! grep -qx -- "$j" <<<"$needs_list"; then
              echo "::error::orphan job '$j' is consulted by no aggregator -- its failure reaches nothing (#850)."
              failed=1
            fi
          done
          for j in $needs_list; do
            if ! grep -qx -- "$j" <<<"$(printf '%s\n' "${all_jobs[@]}")"; then
              echo "::error::aggregator needs '$j' but no such job exists in this workflow (#847)."
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "ok: every non-aggregator job is named in the aggregator's needs"

      - name: Security scan report and verdict
        run: |
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY

          status_icon() {
            case "$1" in
              success) echo ":white_check_mark:" ;;
              failure) echo ":x:" ;;
              cancelled) echo ":grey_question:" ;;
              skipped) echo ":fast_forward:" ;;
              *) echo ":warning:" ;;
            esac
          }

          echo "| Rust Dependency Audit | $(status_icon '${{ needs.rust-audit.result }}') ${{ needs.rust-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Rust License & Ban Check | $(status_icon '${{ needs.rust-deny.result }}') ${{ needs.rust-deny.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Detection (Gitleaks) | $(status_icon '${{ needs.secret-gitleaks.result }}') ${{ needs.secret-gitleaks.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Detection (TruffleHog) | $(status_icon '${{ needs.secret-trufflehog.result }}') ${{ needs.secret-trufflehog.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL Analysis | $(status_icon '${{ needs.codeql.result }}') ${{ needs.codeql.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container Security (Trivy) | $(status_icon '${{ needs.container-scan.result }}') ${{ needs.container-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| License Compliance Check | $(status_icon '${{ needs.license-check.result }}') ${{ needs.license-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Generate SBOM | $(status_icon '${{ needs.sbom.result }}') ${{ needs.sbom.result }} |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "_Audit completed at $(date -u +%Y-%m-%dT%H:%M:%SZ)_" >> $GITHUB_STEP_SUMMARY

          # Two faults this gate historically carried, both of which made a
          # broken security gate read as a working one:
          #
          # 1. It inspected a subset of its `needs:`. Displaying a dependency
          #    is not gating on it -- a failing scan was rendered and then
          #    silently ignored by the decision.
          # 2. `failure` means "this job did not complete". It NEVER means
          #    "this job found something" -- a scanner that crashed, timed
          #    out, or was refused a credential reports the identical result
          #    to one that found a secret. Say "did not complete -- no
          #    verdict", never "found secrets".
          #
          # All dependencies are unconditional (none carries an `if:`), so
          # `skipped` can only mean an upstream failure or a cancelled run,
          # and is failed on, not warned about.
          set -uo pipefail
          ok=0
          total=0
          failed=0

          check() {
            total=$((total + 1))
            case "$2" in
              success)
                ok=$((ok + 1))
                ;;
              *)
                echo "::error::$1 did not complete successfully (result=${2:-<empty>}) -- no verdict was produced, so its evidence is MISSING. This is not a detection."
                failed=$((failed + 1))
                ;;
            esac
          }

          check "Rust dependency audit"      "${{ needs.rust-audit.result }}"
          check "Rust licence & ban check"   "${{ needs.rust-deny.result }}"
          check "Gitleaks"                   "${{ needs.secret-gitleaks.result }}"
          check "TruffleHog"                 "${{ needs.secret-trufflehog.result }}"
          check "CodeQL"                     "${{ needs.codeql.result }}"
          check "Container scan (Trivy)"     "${{ needs.container-scan.result }}"
          check "Licence compliance check"   "${{ needs.license-check.result }}"
          check "SBOM generation"            "${{ needs.sbom.result }}"

          echo "security checks: ${ok} of ${total} succeeded"
          echo "security checks: ${ok} of ${total} succeeded" >> $GITHUB_STEP_SUMMARY

          if [ "$total" -eq 0 ]; then
            echo "::error::0 security checks were evaluated. A rollup with an empty denominator cannot report clean."
            exit 1
          fi

          if [ "$failed" -gt 0 ]; then
            echo "::error::${failed} of ${total} security checks did not complete. Missing evidence is not a pass."
            exit 1
          fi
