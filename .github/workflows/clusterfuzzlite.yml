# This workflow is managed by gh actions-lock.
# Consolidated workflow (behaviour-preserving merge).
# Merged from: cflite_batch.yml, cflite_pr.yml
name: ClusterFuzzLite

on:
  pull_request:
    paths:
    - src/**
    - crates/**
    - fuzz/**
  schedule:
  - cron: '0 2 * * 0'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-fuzzing:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Gated on the presence of fuzz targets — without `fuzz/` (cargo-fuzz)
    # or a ClusterFuzzLite OSS-Fuzz-style harness, the build_fuzzers step
    # has nothing to compile and fails. Job re-activates the moment the
    # fuzz tree lands.
    if: hashFiles('fuzz/Cargo.toml') != '' || hashFiles('.clusterfuzzlite/build.sh') != ''
    steps:
 uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: google/clusterfuzzlite/actions/build_fuzzers@v1
        with:
          language: rust
          sanitizer: address
      - uses: google/clusterfuzzlite/actions/run_fuzzers@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          mode: prune
          sanitizer: address

  batch-fuzzing:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
 uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google/clusterfuzzlite/actions/build_fuzzers@v1
        with:
          language: rust
          sanitizer: address
      - uses: google/clusterfuzzlite/actions/run_fuzzers@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 1800
          mode: batch
          sanitizer: address
