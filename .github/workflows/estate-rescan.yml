# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
# Hypatia Estate Rescan — refresh verisimdb-data/scans with current truth
#
# The canonical security reports (verisimdb-data/scans/*.json) were
# produced by manual local panic-attack runs and went stale: by 2026-06
# the majority of recorded Critical/High findings referenced files that
# no longer existed, or content that had already been fixed, while two
# active repos (vcl-ut, bag-of-actions) had no scan at all. Hypatia kept
# reasoning over that snapshot and the fleet kept dispatching fixes for
# phantom findings.
#
# This workflow is the missing freshness link: it rebuilds the scan
# store centrally with the CURRENT panic-attack (which carries the
# kanren/context/classification FP-suppression absent from the old
# data), so the analyzer's input reflects reality on a daily cadence —
# and on demand the moment a fix lands.
#
# Triggers:
#   - schedule: daily full sweep (staggered off remediation-sweep 03:17
#     and the .git-private-farm Monday maintenance run).
#   - workflow_dispatch: manual, optionally targeted via `repos`.
#   - repository_dispatch (type: estate-rescan): targeted refresh, fired
#     by gitbot-fleet's dispatch-runner after it lands fixes, so resolved
#     findings flush from the store without waiting for the nightly run.
#
# Scope guard: only PUBLIC, non-archived, non-fork repos are scanned —
# verisimdb-data is public, so private-repo findings must never be
# written into it. Repos named 007* are excluded per the owner's
# licence/scanning policy (out of scope for any scanning).

name: Hypatia Estate Rescan

on:
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch:
    inputs:
      repos:
        description: 'Space-separated repo names to rescan (default: all public org repos)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Scan and report, but do not push to verisimdb-data'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  repository_dispatch:
    types: [estate-rescan]

permissions:
  contents: read

# Serialize: concurrent sweeps would race on the verisimdb-data push.
# cancel-in-progress: false so a targeted post-fix rescan request queues
# behind a running nightly sweep instead of killing it.
concurrency:
  group: estate-rescan
  cancel-in-progress: false

jobs:
  rescan:
    name: Rescan estate with panic-attack
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      # Fail in seconds, not in twenty minutes.
      #
      # The write to verisimdb-data is the LAST thing this job does, after a
      # ~300-repo scan. So every time the token was wrong, the run burned the
      # entire scan and then died at the final step. That is how a hard
      # permission wall stayed unnoticed for 26 days: the failure was
      # expensive to reach and looked like a flaky tail-end push.
      #
      # This probe is the same differential test that finally identified the
      # fault: create a ref and delete it again. It touches no content, makes
      # no commit, and takes about a second.
      - name: Preflight — can we actually write to verisimdb-data?
        if: inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.HYPATIA_DISPATCH_PAT }}
        run: |
          set -euo pipefail
          R="hyperpolymath/verisimdb-data"
          PROBE="preflight/${GITHUB_RUN_ID}"
          SHA="$(gh api "repos/${R}/git/ref/heads/main" --jq .object.sha)"
          if ! gh api -X POST "repos/${R}/git/refs" \
                 -f "ref=refs/heads/${PROBE}" -f "sha=${SHA}" --jq .ref >/dev/null 2>"$RUNNER_TEMP/probe-err.txt"; then
            cat "$RUNNER_TEMP/probe-err.txt" >&2
            echo "::error title=verisimdb-data is not writable::HYPATIA_DISPATCH_PAT cannot create a branch on ${R}, so this rescan would discard ~20 minutes of scanning at the final step. Grant the token repository access to ${R} with Contents: Read and write AND Pull requests: Read and write. Note a fine-grained PAT must list the repo explicitly; org/user-wide scope is not inherited."
            exit 78
          fi
          gh api -X DELETE "repos/${R}/git/refs/heads/${PROBE}" >/dev/null
          echo "verisimdb-data is writable — proceeding with the scan."

      - name: Resolve panic-attack version
        id: pa_ref
        run: echo "sha=$(git ls-remote https://github.com/hyperpolymath/panic-attack.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache built panic-attack
        id: pa_cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/panic-attack-bin
          # Exact-SHA key, no restore-keys: a partial hit would scan with
          # stale rules (same reasoning as the hypatia-scan build cache).
          key: panic-attack-${{ runner.os }}-${{ steps.pa_ref.outputs.sha }}

      - name: Build panic-attack (if needed)
        if: steps.pa_cache.outputs.cache-hit != 'true'
        env:
          PA_SHA: ${{ steps.pa_ref.outputs.sha }}
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/hyperpolymath/panic-attack.git "$RUNNER_TEMP/panic-attack"
          cd "$RUNNER_TEMP/panic-attack"
          git fetch --depth 1 origin "$PA_SHA" && git checkout "$PA_SHA"
          cargo build --release
          mkdir -p "$HOME/panic-attack-bin"
          cp target/release/panic-attack "$HOME/panic-attack-bin/"

      - name: Resolve repo list
        id: repos
        env:
          GH_TOKEN: ${{ secrets.HYPATIA_DISPATCH_PAT }}
          INPUT_REPOS: ${{ inputs.repos }}
          PAYLOAD_REPOS: ${{ github.event.client_payload.repos }}
        run: |
          set -euo pipefail
          REQUESTED="${INPUT_REPOS:-${PAYLOAD_REPOS:-}}"
          if [ -n "$REQUESTED" ]; then
            # Targeted rescan: validate each requested name against the
            # public-repo constraint rather than trusting the payload.
            printf '%s' "$REQUESTED" | tr ' ,' '\n\n' | sed '/^$/d' | sort -u > /tmp/requested.txt
            : > /tmp/repo-list.txt
            while IFS= read -r name; do
              # Names come from a repository_dispatch payload — enforce a
              # strict charset before using them anywhere.
              if ! printf '%s' "$name" | grep -Eq '^[A-Za-z0-9._-]+$'; then
                echo "::warning::Skipping invalid repo name in payload: $name"
                continue
              fi
              VISIBILITY=$(gh api "repos/hyperpolymath/$name" --jq '[.private, .archived, .fork] | @tsv' 2>/dev/null || echo "missing")
              if [ "$VISIBILITY" = "$(printf 'false\tfalse\tfalse')" ]; then
                echo "$name" >> /tmp/repo-list.txt
              else
                echo "::warning::Skipping $name (private/archived/fork/missing — not eligible for the public scan store)"
              fi
            done < /tmp/requested.txt
          else
            gh api "users/hyperpolymath/repos?type=public&per_page=100" --paginate \
              --jq '.[] | select(.archived == false and .fork == false and .disabled == false) | .name' \
              | grep -Ev '^007' \
              | grep -Ev '^(verisimdb-data|hyperpolymath-archive)' \
              | sort -u > /tmp/repo-list.txt
          fi
          COUNT=$(wc -l < /tmp/repo-list.txt)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Rescanning $COUNT repos"

      - name: Checkout verisimdb-data
        env:
          GH_TOKEN: ${{ secrets.HYPATIA_DISPATCH_PAT }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/hyperpolymath/verisimdb-data.git" "$RUNNER_TEMP/verisimdb-data"

      - name: Scan repos
        id: scan
        run: |
          set -uo pipefail
          PA="$HOME/panic-attack-bin/panic-attack"
          DATA="$RUNNER_TEMP/verisimdb-data"
          FAILED=0
          SCANNED=0
          while IFS= read -r name; do
            workdir="$RUNNER_TEMP/work/$name"
            rm -rf "$workdir"
            if ! git clone --depth 1 --quiet "https://github.com/hyperpolymath/$name.git" "$workdir" 2>/dev/null; then
              echo "::warning::clone failed: $name"
              FAILED=$((FAILED+1))
              continue
            fi
            if "$PA" assail "$workdir" --output "$RUNNER_TEMP/scan-raw.json" >/dev/null 2>&1; then
              # Normalize program_path to the repo name: runner paths are
              # meaningless to consumers and leaked local paths were one of
              # the defects of the manual-scan era (`/var$REPOS_DIR/...`).
              jq --arg name "$name" '.program_path = $name' \
                "$RUNNER_TEMP/scan-raw.json" > "$DATA/scans/$name.json"
              SCANNED=$((SCANNED+1))
            else
              echo "::warning::scan failed: $name"
              FAILED=$((FAILED+1))
            fi
            rm -rf "$workdir"
          done < /tmp/repo-list.txt
          echo "scanned=$SCANNED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "Scanned $SCANNED repos ($FAILED failures)"

      - name: Commit refreshed scans
        id: commit_scans
        if: inputs.dry_run != 'true'
        env:
          SCANNED: ${{ steps.scan.outputs.scanned }}
        run: |
          set -euo pipefail
          DATA="$RUNNER_TEMP/verisimdb-data"
          cd "$DATA"
          git config user.name "hypatia-estate-rescan"
          git config user.email "hypatia-bot@users.noreply.github.com"
          git add scans/
          if git diff --cached --quiet; then
            echo "No scan changes to push."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "scan: estate rescan ($SCANNED repos, panic-attack refresh)"

      - name: Publish to verisimdb-data (two signed, squash-merged PRs)
        if: inputs.dry_run != 'true' && steps.commit_scans.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.HYPATIA_DISPATCH_PAT }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          DATA="$RUNNER_TEMP/verisimdb-data"
          REPO="hyperpolymath/verisimdb-data"
          cd "$DATA"

          # WHY TWO PRs, AND WHY SQUASH.
          #
          # verisimdb-data's `Base` ruleset requires `pull_request` AND
          # `required_signatures` on main, plus `required_linear_history`.
          # That eliminates every other option, as GitHub itself told us:
          #
          #     GraphQL: Base branch requires signed commits.
          #     Rebase merges cannot be automatically signed by GitHub
          #
          #   direct push  -> refused, `pull_request` required
          #   merge commit -> refused, `required_linear_history`
          #   rebase merge -> refused, cannot be signed (measured, above)
          #   squash merge -> GitHub authors ONE new commit server-side and
          #                   signs it. The only method that satisfies all three.
          #
          # But a single squash of "scans + index" would break the index
          # contract. scripts/regen-index.sh line 44 derives the timestamp as:
          #
          #     last_updated="$(git log -1 --format=%cI -- "$SCAN_DIR")"
          #
          # i.e. the commit time of the newest commit touching scans/. Squashing
          # both changes together makes that ONE commit touch scans/ as well as
          # index.json, while index.json still carries a timestamp computed
          # before that commit existed — so index-freshness.yml, which reruns
          # this same script at HEAD and diffs, would fail.
          #
          # Publishing as two squashes keeps them separate: PR 1 lands exactly
          # one commit touching scans/, PR 2 lands exactly one commit that does
          # not. The index is regenerated AGAINST MERGED main, so the timestamp
          # it records is the real post-merge scans commit.

          publish() {
            local suffix="$1" title="$2"
            local branch pr_url pr_num state
            branch="estate-rescan/${RUN_ID}-${suffix}"
            git push origin "HEAD:refs/heads/${branch}"
            pr_url="$(gh pr create --repo "$REPO" --base main --head "$branch" \
              --title "$title" \
              --body "Automated estate rescan from hyperpolymath/hypatia run ${RUN_ID}. Squash-merged: it is the only merge method that satisfies required_signatures + required_linear_history on this repo.")"
            pr_num="${pr_url##*/}"
            echo "opened ${pr_url}"
            # --auto, not a bare merge. A plain `gh pr merge --squash` is
            # evaluated the instant the PR is created, before the base-branch
            # policy has settled, and returns
            #     "not mergeable: the base branch policy prohibits the merge"
            # — while the merge then lands ~30s later anyway. That exact
            # false negative made run 29843933209 report failure for a rescan
            # that HAD in fact merged (verisimdb-data#54, merged 15:37:35Z).
            # --auto queues it and lets GitHub merge when the policy allows.
            if ! gh pr merge "$pr_num" --repo "$REPO" --squash --auto --delete-branch; then
              echo "::error title=verisimdb-data merge could not be queued::PR #${pr_num} (${suffix}) opened but auto-merge was refused. Check the Base ruleset and that the token has Pull requests: Read and write."
              return 1
            fi
            # Poll for the END STATE. Never infer the merge from the exit code
            # of the command that requested it.
            state=""
            for _ in $(seq 1 40); do
              state="$(gh pr view "$pr_num" --repo "$REPO" --json state --jq .state)"
              [ "$state" = "MERGED" ] && break
              [ "$state" = "CLOSED" ] && break
              sleep 15
            done
            if [ "$state" != "MERGED" ]; then
              echo "::error title=verisimdb-data not updated::PR #${pr_num} (${suffix}) is ${state:-UNKNOWN} after 10 minutes, not MERGED. The fact-store did NOT receive this rescan."
              return 1
            fi
            echo "merged ${pr_url}"
          }

          # ---- PR 1: the scans commit made in the previous step -------------
          publish "scans" "scan: estate rescan (run ${RUN_ID})"

          # ---- regenerate the index against MERGED main ---------------------
          git fetch --depth=50 origin main
          git reset --hard FETCH_HEAD
          bash scripts/regen-index.sh
          git add index.json
          if git diff --cached --quiet; then
            echo "index already current after the scans merge — nothing further to publish."
            exit 0
          fi
          git commit -m "index: regen after estate rescan (run ${RUN_ID})"

          # ---- PR 2: index only, touching no file under scans/ --------------
          publish "index" "index: regen after estate rescan (run ${RUN_ID})"

      - name: Job summary
        env:
          COUNT: ${{ steps.repos.outputs.count }}
          SCANNED: ${{ steps.scan.outputs.scanned }}
          FAILED: ${{ steps.scan.outputs.failed }}
          DRY: ${{ inputs.dry_run }}
        run: |
          {
            echo "## Estate Rescan"
            echo "- Repos targeted: $COUNT"
            echo "- Scanned OK: $SCANNED"
            echo "- Failures: $FAILED"
            echo "- Dry run: ${DRY:-false}"
          } >> "$GITHUB_STEP_SUMMARY"
