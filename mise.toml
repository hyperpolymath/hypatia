[tools]
# Language runtimes
node = "latest"
rust = "latest"
go = "latest"
zig = "0.16.0"   # pinned; .github/workflows/zig.yml asserts this equals ZIG_VERSION
java = "latest"
bun = "latest"

# Package managers
npm = "latest"
yarn = "latest"
pnpm = "latest"
cargo = "latest"
go-task = "latest"

# Formatting & Linting
gofmt = "latest"
prettier = "latest"
shfmt = "latest"
stylua = "latest"

# Build tools
cmake = "latest"
make = "latest"
ninja = "latest"

# Shell tools
git = "latest"
gnu-sed = "latest"
gnu-tar = "latest"
gnu-grep = "latest"

# Testing
vitest = "latest"
jest = "latest"

[env]
# Common environment variables
NODE_ENV = "development"

# Task runner alias
[alias]
task = "go-task"
build = "cargo build --release || npm run build || go build"
test = "cargo test || npm test || go test ./..."
lint = "prettier --check ."
fmt = "prettier --write ."
