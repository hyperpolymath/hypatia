[tools]
# Language runtimes
node = "latest"
rust = "latest"   # provides cargo, rustfmt and clippy
go = "latest"     # provides gofmt
zig = "0.16.0"   # pinned; .github/workflows/zig.yml asserts this equals ZIG_VERSION
java = "latest"
bun = "latest"

# Package managers
npm = "latest"
yarn = "latest"
pnpm = "latest"

# Formatting & Linting
prettier = "latest"
shfmt = "latest"
stylua = "latest"

# Build tools
cmake = "latest"
make = "latest"
ninja = "latest"

# Not listed on purpose: git, GNU sed/tar/grep (system tools), go-task, vitest
# and jest. None resolves in the mise registry, so listing them made mise warn
# on every `cd` into the repo. The command shortcuts that used to sit under
# [alias] were never tool aliases; `just --list` is the task entry point.

[env]
# Common environment variables
NODE_ENV = "development"
